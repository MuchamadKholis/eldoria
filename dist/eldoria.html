<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Eldoria — Kingdoms at War</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito:wght@500;700;800;900&display=swap">
  <style>
/* =====================================================================
 * Eldoria — style.css
 * Heraldic UI: deep navy glass panels, gilded edges, chunky readable
 * game buttons. Theme tokens at the top.
 * ===================================================================== */
:root {
  --ink: #18234a; --panel: rgba(28, 38, 78, 0.94); --panel2: #2a3a74; --line: rgba(240, 200, 110, 0.45);
  --gold: #f0c35c; --gold-hi: #ffe39a; --gold-deep: #8a5f17; --text: #fbf4e2; --muted: #c6cce0;
  --green: #5fd17a; --red: #ff6a5a; --gem: #4fd18a; --rune: #a98bff;
  --display: 'Cinzel', Georgia, 'Times New Roman', serif; --body: 'Nunito', 'Segoe UI', system-ui, sans-serif;
  --shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
  color-scheme: dark; box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ink: #0b1028; --panel: rgba(14, 20, 46, 0.94); --panel2: #1c2858; --muted: #aab2cc; } }
:root[data-theme="dark"] { --ink: #0b1028; --panel: rgba(14, 20, 46, 0.94); --panel2: #1c2858; --muted: #aab2cc; }
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body { height: 100%; margin: 0; overflow: hidden; background: #16210f; color: var(--text); font: 600 15px/1.4 var(--body); -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
#app { position: relative; height: 100%; overflow: hidden; }
.hidden { display: none !important; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; line-height: 1.15; }
h2, h3 { font-family: var(--display); letter-spacing: 0.02em; }
input[type=text], input:not([type]) { user-select: text; -webkit-user-select: text; }
.ico { display: inline-flex; width: 1.2em; height: 1.2em; vertical-align: -0.22em; flex: none; }
.ico svg { width: 100%; height: 100%; }
.world { position: absolute; inset: 0; }
#cv { display: block; touch-action: none; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; padding: 6px 14px;
  border-radius: 10px; border: 2px solid rgba(0, 0, 0, 0.35); font-weight: 800; color: var(--text);
  background: linear-gradient(180deg, #4a5a9a, #2c3a72); box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.18), 0 3px 0 rgba(0, 0, 0, 0.45);
  transition: transform .06s, filter .12s; flex-wrap: wrap;
}
.btn:hover:not(:disabled) { filter: brightness(1.12); }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.18), 0 1px 0 rgba(0, 0, 0, 0.45); }
.btn:disabled { filter: grayscale(0.6) brightness(0.8); opacity: 0.7; }
.btn-gold { background: linear-gradient(180deg, #ffe08a, #f0b43a 55%, #c9861c); color: #3a2204; border-color: #7a4a0a; text-shadow: 0 1px 0 rgba(255, 245, 210, 0.6); }
.btn-gem { background: linear-gradient(180deg, #7ff0aa, #2fae6a); color: #06301a; border-color: #0a4a28; }
.btn-danger { background: linear-gradient(180deg, #ff7a6a, #c3342a); border-color: #5a0f0a; }
.btn-danger-quiet { background: rgba(255, 90, 80, 0.12); border-color: rgba(255, 106, 90, 0.6); color: #ffb3a8; box-shadow: none; }
.btn-quiet { background: rgba(255, 255, 255, 0.08); box-shadow: none; border-color: rgba(255, 255, 255, 0.2); }
.btn-lg { min-height: 50px; font-size: 1.08rem; padding: 8px 20px; }
.btn-block { width: 100%; }
.icon-btn, .x-btn { width: 40px; height: 40px; border-radius: 50%; display: inline-grid; place-items: center; background: rgba(0, 0, 0, 0.35); border: 2px solid var(--line); color: var(--gold-hi); padding: 0; flex: none; }
.icon-btn .ico, .x-btn .ico { width: 20px; height: 20px; }
.x-btn { position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
.row.center { justify-content: center; }
.row-between { display: flex; gap: 12px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; border-radius: 999px; background: rgba(0, 0, 0, 0.32); font-weight: 800; font-size: 0.88rem; white-space: nowrap; }
.chip.short { color: #ff9a8a; background: rgba(255, 80, 60, 0.15); }
.chip.done { color: var(--green); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.muted { color: var(--muted); font-weight: 600; }
.warn { color: #ffb38a; font-weight: 700; }
.good { color: var(--green); font-weight: 800; }
.label { color: var(--muted); font-size: 0.82rem; font-weight: 700; display: block; }
.kicker { color: var(--gold); font-size: 0.8rem; font-weight: 800; letter-spacing: 0.04em; }
.tag { display: inline-flex; align-items: center; gap: 3px; font-size: 0.75rem; font-weight: 800; padding: 1px 8px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); }
.tag.boss { background: rgba(255, 90, 70, 0.25); color: #ffb3a8; }
.req { display: inline-flex; align-items: center; gap: 4px; color: #ffb38a; font-size: 0.85rem; font-weight: 700; }
.maxed { color: var(--green); font-weight: 800; }
.bar { height: 8px; background: rgba(0, 0, 0, 0.45); border-radius: 999px; overflow: hidden; margin: 4px 0; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, #6fd36a, #b8f070); border-radius: 999px; }
.bar.big { height: 12px; }
.bar.mini { display: inline-block; width: 60px; height: 7px; vertical-align: middle; margin: 0 0 0 4px; }
.panel { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); }
.stars { display: inline-flex; gap: 1px; vertical-align: middle; }
.star { width: 16px; height: 16px; display: inline-flex; color: rgba(255, 255, 255, 0.2); }
.star svg { width: 100%; height: 100%; }
.star.on { color: var(--gold-hi); filter: drop-shadow(0 0 3px rgba(255, 220, 120, 0.7)); }
.bullets { margin: 6px 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }

/* ---------- HUD ---------- */
.hud { position: absolute; top: env(safe-area-inset-top, 0px); left: 0; right: 0; z-index: 5; display: flex; align-items: center; gap: 8px; padding: 8px 10px; pointer-events: none; }
.hud > * { pointer-events: auto; }
.player { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 2px solid var(--line); border-radius: 999px; padding: 3px 12px 3px 3px; min-height: 44px; }
.player .lvl { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 900; font-size: 1.1rem; background: radial-gradient(circle at 35% 30%, #9fd8ff, #3a7ad8 60%, #1a3a8a); border: 2px solid #c9e4ff; }
.pname { display: flex; flex-direction: column; text-align: left; min-width: 90px; max-width: 150px; }
.pname b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.9rem; }
.xpbar { height: 6px; background: rgba(0, 0, 0, 0.5); border-radius: 99px; overflow: hidden; margin-top: 3px; }
.xpbar i { display: block; height: 100%; background: linear-gradient(90deg, #7fc8ff, #c0e6ff); }
.res-row { flex: 1; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.res { display: flex; align-items: center; gap: 6px; background: var(--panel); border: 2px solid var(--line); border-radius: 999px; padding: 3px 12px 3px 6px; min-height: 40px; }
.res .ico { width: 24px; height: 24px; }
.res-txt { display: flex; flex-direction: column; line-height: 1; min-width: 52px; text-align: left; }
.res-txt b { font-size: 0.98rem; font-variant-numeric: tabular-nums; }
.cap { height: 5px; background: rgba(0, 0, 0, 0.5); border-radius: 99px; overflow: hidden; margin-top: 3px; }
.cap i { display: block; height: 100%; background: var(--gold); }
.cap i.full { background: var(--red); }
.res.gem b { color: #b8ffd4; font-variant-numeric: tabular-nums; }
.sidebar { position: absolute; left: 10px; top: calc(env(safe-area-inset-top, 0px) + 62px); z-index: 4; display: flex; flex-direction: column; gap: 8px; max-width: 260px; }
.side-row { display: flex; gap: 6px; flex-wrap: wrap; }
.chip-btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--panel); border: 2px solid var(--line); font-weight: 800; min-height: 38px; font-size: 0.88rem; }
.chip-btn.gold { background: linear-gradient(180deg, #ffe08a, #e0a43a); color: #3a2204; border-color: #7a4a0a; animation: pulse 1.6s ease-in-out infinite; }
.goals { background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
.goals-head { display: flex; align-items: center; gap: 6px; background: none; border: 0; padding: 2px 4px; font-weight: 900; color: var(--gold-hi); min-height: 30px; text-align: left; }
.goals-head span { flex: 1; font-family: var(--display); font-size: 0.9rem; }
.goals-head b { background: var(--gold); color: #3a2204; border-radius: 999px; min-width: 20px; height: 20px; display: grid; place-items: center; font-size: 0.75rem; }
.goals-head .chev { font-style: normal; color: var(--muted); }
.goals:not(.open) .goal:not(.first) { display: none; }
.goal { text-align: left; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; padding: 6px 8px; font-size: 0.85rem; font-weight: 700; }
.goal::before { content: '▸ '; color: var(--gold); }
.goal:hover { background: rgba(255, 220, 120, 0.15); }
.dock { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); transform: translateX(-50%); z-index: 5; display: flex; gap: 6px; padding: 6px; background: var(--panel); border: 2px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); }
.dock-btn { display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 64px; min-height: 58px; padding: 5px 6px; border-radius: 12px; background: linear-gradient(180deg, #44548f, #2a3870); border: 2px solid rgba(0, 0, 0, 0.35); font-weight: 800; font-size: 0.8rem; box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.15); }
.dock-btn .ico { width: 28px; height: 28px; }
.dock-btn.big { min-width: 82px; background: linear-gradient(180deg, #ffd977, #e09a2a); color: #3a2204; border-color: #7a4a0a; }
.dock-btn.big.red { background: linear-gradient(180deg, #ff8a72, #c3342a); color: #fff; border-color: #5a0f0a; }
.dock-btn:active { transform: translateY(2px); }

/* Building panel */
.bpanel { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 92px); z-index: 6; width: min(560px, calc(100% - 20px)); background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 12px; box-shadow: var(--shadow); animation: up .18s ease-out; }
@keyframes up { from { opacity: 0; transform: translate(-50%, 10px); } }
.panel-head { display: flex; gap: 10px; align-items: center; padding-right: 36px; }
.panel-head canvas { width: 64px; height: 64px; flex: none; }
.panel-head h3 { font-size: 1.15rem; }
.panel-head .lv { font-family: var(--body); font-size: 0.85rem; color: var(--gold); font-weight: 900; }
.panel-head p { margin: 2px 0 0; color: var(--muted); font-size: 0.88rem; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px 12px; margin: 8px 0; }
.stats div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dotted rgba(255, 255, 255, 0.12); padding: 2px 0; font-size: 0.88rem; }
.stats dt { color: var(--muted); } .stats dd { margin: 0; font-weight: 800; }
.stats.compare s { color: var(--muted); font-weight: 600; } .stats.compare b { color: var(--green); }
.panel-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.placebar { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 92px); z-index: 6; display: flex; align-items: center; gap: 10px; background: var(--panel); border: 2px solid var(--line); border-radius: 999px; padding: 6px 6px 6px 16px; box-shadow: var(--shadow); max-width: calc(100% - 20px); }
.placebar > span { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; font-weight: 800; }
.round-btn { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; border: 2px solid rgba(0, 0, 0, 0.35); flex: none; }
.round-btn .ico { width: 24px; height: 24px; }
.round-btn.ok { background: linear-gradient(180deg, #8af08a, #2fa84a); color: #06300f; }
.round-btn.no { background: linear-gradient(180deg, #ff8a7a, #c3342a); color: #fff; }

/* ---------- Toasts ---------- */
.toasts { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 64px); left: 50%; transform: translateX(-50%); z-index: 30; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: min(460px, 92%); }
.toast { background: rgba(10, 14, 32, 0.95); border: 2px solid rgba(255, 255, 255, 0.15); border-left: 5px solid var(--muted); padding: 8px 14px; border-radius: 10px; font-weight: 800; font-size: 0.92rem; animation: tin .2s ease-out; transition: opacity .4s; text-align: center; }
.toast.out { opacity: 0; }
.toast-good { border-left-color: var(--green); } .toast-warn { border-left-color: #ffb33a; } .toast-bad { border-left-color: var(--red); }
@keyframes tin { from { opacity: 0; transform: translateY(-6px); } }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px rgba(255, 220, 120, 0.35), 0 0 16px rgba(255, 220, 120, 0.6); } }

/* ---------- Modal ---------- */
.modal { position: absolute; inset: 0; z-index: 25; display: grid; place-items: center; padding: 14px; background: rgba(4, 6, 16, 0.6); backdrop-filter: blur(3px); overflow-y: auto; }
.modal-card { position: relative; width: min(500px, 100%); background: linear-gradient(180deg, var(--panel2), var(--ink)); border: 2px solid var(--gold); border-radius: 18px; padding: 20px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7); animation: pop .25s cubic-bezier(.2, .9, .3, 1.2); max-height: calc(100% - 20px); overflow-y: auto; }
@keyframes pop { from { opacity: 0; transform: scale(0.92); } }
.modal-card h3 { font-size: 1.4rem; color: var(--gold-hi); margin-bottom: 6px; padding-right: 34px; }
.modal-card p { margin: 6px 0; }
.up-head { display: flex; gap: 12px; align-items: center; }
.up-head canvas { width: 76px; height: 76px; flex: none; }
.up-cost { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
.up-cost > div { display: flex; gap: 4px; flex-wrap: wrap; }
.unlocks { background: rgba(255, 220, 120, 0.08); border-radius: 10px; padding: 8px 12px; margin: 8px 0; }
.unlocks h4 { color: var(--gold); font-size: 0.9rem; }
.unlocks ul { margin: 4px 0 0; padding-left: 1.1em; font-size: 0.9rem; columns: 2; }
.more-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.more-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 6px; border-radius: 12px; background: rgba(255, 255, 255, 0.06); border: 2px solid rgba(255, 255, 255, 0.12); font-weight: 800; }
.more-btn .ico { width: 30px; height: 30px; }
.boons { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.boon { text-align: left; display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 12px; background: linear-gradient(180deg, #3a4a8a, #24306a); border: 2px solid var(--line); }
.boon b { color: var(--gold-hi); font-size: 1.05rem; } .boon span { color: var(--muted); }
.boon:hover { border-color: var(--gold-hi); }
.results { text-align: center; }
.results h2 { font-size: 2rem; color: var(--gold-hi); text-shadow: 0 3px 0 #3a2506; }
.results.lose h2 { color: #ffb3a8; }
.big-stars { display: flex; justify-content: center; gap: 4px; margin: 8px 0; }
.bstar { width: 56px; height: 56px; display: inline-flex; color: rgba(255, 255, 255, 0.15); }
.bstar svg { width: 100%; height: 100%; }
.bstar.on { color: var(--gold-hi); filter: drop-shadow(0 0 10px rgba(255, 220, 120, 0.8)); animation: starpop .45s cubic-bezier(.2, 1.6, .4, 1) both; animation-delay: calc(var(--i) * 0.25s + 0.2s); }
@keyframes starpop { from { transform: scale(0) rotate(-40deg); opacity: 0; } }
.big-num { font-family: var(--display); font-size: 1.3rem; margin: 4px 0; }
.res-lines { display: flex; flex-direction: column; gap: 6px; margin: 10px 0; text-align: left; }
.res-line { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; background: rgba(0, 0, 0, 0.25); border-radius: 10px; padding: 6px 10px; }
.res-line > span:last-child { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }

/* ---------- Sheets ---------- */
.sheet { position: absolute; inset: 0; z-index: 20; background: radial-gradient(1200px 600px at 50% -10%, #2a3a74, #0b1028 70%); overflow: hidden; animation: fade .2s ease-out; }
@keyframes fade { from { opacity: 0; } }
.sheet-inner { height: 100%; display: flex; flex-direction: column; }
.sheet-head { display: flex; align-items: center; gap: 12px; padding: 10px clamp(10px, 3vw, 28px); border-bottom: 2px solid var(--line); background: rgba(0, 0, 0, 0.25); flex: none; }
.sheet-head h2 { flex: 1; font-size: clamp(1.2rem, 3vw, 1.7rem); color: var(--gold-hi); }
.btn-back { display: inline-flex; align-items: center; gap: 4px; min-height: 42px; padding: 6px 14px 6px 8px; border-radius: 10px; background: rgba(255, 255, 255, 0.08); border: 2px solid rgba(255, 255, 255, 0.2); font-weight: 800; }
.mini-res { display: flex; gap: 10px; font-weight: 800; font-size: 0.88rem; flex-wrap: wrap; }
.mini-res span { display: inline-flex; align-items: center; gap: 3px; }
.sheet-body { flex: 1; overflow-y: auto; padding: 14px clamp(10px, 3vw, 28px) 40px; }
.lead { color: var(--muted); max-width: 72ch; margin: 0 0 14px; }
.group { font-family: var(--display); color: var(--gold); margin: 18px 0 8px; font-size: 1.05rem; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.tab { padding: 8px 16px; border-radius: 999px; background: rgba(255, 255, 255, 0.08); border: 2px solid rgba(255, 255, 255, 0.15); font-weight: 800; min-height: 40px; }
.tab.on { background: var(--gold); color: #3a2204; border-color: var(--gold-deep); }
.shop-grid, .troop-grid, .hero-grid, .op-grid, .stage-grid, .region-grid, .k-grid, .res-grid, .stat-grid { display: grid; gap: 12px; }
.shop-grid { grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); }
.shop-card { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; padding: 10px; border-radius: 14px; background: var(--panel); border: 2px solid var(--line); }
.shop-card canvas { width: 100%; height: 96px; }
.shop-card b { font-family: var(--display); font-size: 1.02rem; }
.shop-card .costs { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
.shop-card .count, .shop-card .meta { color: var(--muted); font-size: 0.82rem; display: inline-flex; align-items: center; gap: 3px; }
.shop-card .desc { color: var(--muted); font-size: 0.8rem; font-weight: 600; }
.shop-card.blocked { opacity: 0.75; } .shop-card:disabled { opacity: 0.5; }
.shop-card.focus { border-color: var(--gold-hi); box-shadow: 0 0 0 3px rgba(255, 220, 120, 0.4); }
.shop-card:hover:not(:disabled) { border-color: var(--gold-hi); }
.region-grid { grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.region-card { display: flex; flex-direction: column; padding: 0; overflow: hidden; text-align: left; border-radius: 14px; background: var(--panel); border: 2px solid var(--line); }
.region-card canvas { width: 100%; height: 150px; border-bottom: 3px solid var(--accent); }
.region-card.locked canvas { filter: grayscale(0.85) brightness(0.5); }
.region-card:hover:not(:disabled) { border-color: var(--accent); }
.rc-body { padding: 10px 14px 14px; }
.rc-body h3 { font-size: 1.25rem; } .rc-body p { margin: 2px 0 8px; color: var(--muted); }
.rc-meta { display: flex; align-items: center; gap: 6px; font-weight: 800; }
.stage-grid { grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.stage-card { display: flex; flex-direction: column; border-radius: 14px; background: var(--panel); border: 2px solid var(--line); overflow: hidden; }
.stage-card.locked { opacity: 0.6; }
.stage-card > canvas { width: 100%; height: 130px; }
.sc-body { padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 6px; }
.sc-top { display: flex; gap: 8px; align-items: center; } .sc-top .stars { margin-left: auto; }
.obj { margin: 0; color: var(--muted); font-size: 0.88rem; display: flex; gap: 6px; }

/* ---------- Battle HUD ---------- */

.b-banner { position: absolute; top: 22%; left: 50%; transform: translate(-50%, -8px); display: flex; flex-direction: column; align-items: center; text-align: center; opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none; width: 90%; }
.b-banner b { font-family: var(--display); font-size: clamp(1.4rem, 4.5vw, 2.4rem); color: var(--gold-hi); text-shadow: 0 3px 0 #3a2506, 0 0 20px rgba(0, 0, 0, 0.9); }

/* ---------- Title ---------- */

.title h1 span:last-child { background: linear-gradient(180deg, #e6f2ff 0%, #9fc8ff 40%, #3a5aa8 62%, #c9e0ff 100%); -webkit-background-clip: text; background-clip: text; }

.t-foot { color: rgba(255, 255, 255, 0.45); font-size: 0.8rem; margin-top: 16px; }

/* ---------- Responsive: phones first ---------- */
@media (max-width: 760px) {
  /* Kingdom HUD: one compact row */
  .hud { padding: 6px 8px; gap: 6px; }
  .player { padding: 2px; min-height: 0; } .player .lvl { width: 34px; height: 34px; font-size: 1rem; }
  .pname { display: none; }
  .res-row { flex-wrap: nowrap; gap: 4px; justify-content: flex-start; min-width: 0; }
  .res { padding: 2px 7px 2px 3px; min-height: 34px; gap: 4px; flex: 0 1 auto; min-width: 0; }
  .res .ico { width: 18px; height: 18px; }
  .res-txt { min-width: 30px; } .res-txt b, .res.gem b { font-size: 0.8rem; }
  .cap { height: 4px; }
  .res.gem:last-child, #hud-settings { display: none; }
  /* Builders, collect-all and Tasks under the HUD */
  .sidebar { top: calc(env(safe-area-inset-top, 0px) + 50px); left: 8px; right: 8px; max-width: none; gap: 6px; }
  .side-row .chip-btn { min-height: 34px; padding: 4px 10px; font-size: 0.8rem; }
  .goals { padding: 4px 6px 6px; max-width: 420px; }
  .goal { font-size: 0.82rem; padding: 7px 8px; }
  /* Dock */
  .dock { gap: 4px; padding: 4px; width: calc(100% - 12px); justify-content: space-between; bottom: calc(env(safe-area-inset-bottom, 0px) + 6px); }
  .dock-btn { min-width: 0; flex: 1; font-size: 0.68rem; min-height: 54px; padding: 4px 2px; } .dock-btn.big { min-width: 0; } .dock-btn .ico { width: 26px; height: 26px; }
  .bpanel, .placebar { bottom: calc(env(safe-area-inset-bottom, 0px) + 72px); }
  .bpanel { max-height: 52vh; overflow-y: auto; padding: 10px; }
  .panel-head canvas { width: 52px; height: 52px; }
  .panel-actions .btn { flex: 1 1 auto; }
  .placebar { padding-left: 12px; font-size: 0.85rem; }
  .toasts { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 140px); }
  /* Sheets */
  .sheet-head { padding: 8px 10px; gap: 8px; } .btn-back span { display: none; } .btn-back { padding: 6px 8px; }
  .mini-res { display: none; }
  .sheet-body { padding: 12px 10px 40px; }
  .prep { grid-template-columns: 1fr; } .army-head { grid-template-columns: 1fr; }
  .unlocks ul { columns: 1; }
  .modal-card { padding: 16px; }
  .more-grid { grid-template-columns: repeat(3, 1fr); }
  /* Battle HUD */
  .b-top { left: 6px; right: 6px; top: calc(env(safe-area-inset-top, 0px) + 6px); gap: 6px; }
  .bt-info { justify-content: flex-start; gap: 4px; }
  .pill { padding: 2px 8px; min-height: 30px; font-size: 0.78rem; border-width: 1.5px; }
  .pill .ico, .stars-pill .star { width: 16px; height: 16px; }
  .hud-pill { min-width: 40px; min-height: 40px; }
  .b-top > .icon-btn { width: 40px; height: 40px; }
  .b-boss { top: calc(env(safe-area-inset-top, 0px) + 78px); width: calc(100% - 24px); }
  .b-banner { top: 28%; } .b-banner b { font-size: 1.4rem; } .b-banner span { font-size: 0.85rem; }
  .b-bar { left: 6px; right: 6px; transform: none; max-width: none; bottom: calc(env(safe-area-inset-bottom, 0px) + 6px); padding: 4px; gap: 4px; scrollbar-width: none; }
  .b-bar::-webkit-scrollbar { display: none; }
  .b-card { width: 66px; } .b-card canvas { width: 50px; height: 40px; }
  .b-call { right: 8px; bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); min-height: 44px; padding: 6px 14px; font-size: 0.9rem; }
  .b-tower { bottom: calc(env(safe-area-inset-bottom, 0px) + 150px); width: calc(100% - 24px); }
}
@media (max-width: 380px) {
  .res { padding-right: 5px; } .res-txt { min-width: 26px; } .res-txt b, .res.gem b { font-size: 0.74rem; }
  .dock-btn { font-size: 0.62rem; }
  .b-card { width: 60px; }
}
@media (max-height: 520px) and (orientation: landscape) {
  .dock { bottom: 4px; } .dock-btn { min-height: 44px; } .dock-btn .ico { width: 22px; height: 22px; }
  .sidebar { top: calc(env(safe-area-inset-top, 0px) + 54px); }
  .b-card { width: 62px; } .b-card canvas { width: 46px; height: 34px; }
  .b-call { bottom: 84px; }
  .bpanel { bottom: 62px; max-height: 60vh; overflow-y: auto; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; } }

 * ===================================================================== */

  background: linear-gradient(180deg, #ff6a5a, #b82a20); border: 2px solid #ffd0c8; font-weight: 900; cursor: pointer; box-shadow: 0 0 20px rgba(255, 60, 40, 0.6); animation: pulse 1.2s ease-in-out infinite; max-width: calc(100% - 16px); text-align: center; }

  <script>/* js/data/content.js */
/* =====================================================================
 * Crownhold — data/content.js
 *  - CH.REGIONS / CH.Campaign : 6 regions × 6 stages with objectives

 * ===================================================================== */
(function () {
  const C = CH.CONFIG, U = CH.util;

  CH.REGIONS = [
    { id: 'greenwood', name: 'Greenwood Kingdom', sub: 'Goblin raiders in the emerald woods', castle: 1,
      pal: { g1: '#4f8a3c', g2: '#5f9a47', g3: '#3d7230', path: '#c2a46e', edge: '#7a5d39', accent: '#7fd36a' }, decor: 'forest',
      pool: [{ t: 'goblin', from: 0, w: 6 }, { t: 'wolf', from: 1, w: 5 }, { t: 'bat', from: 2, w: 3 }, { t: 'orc', from: 3, w: 3 }], boss: 'trollChief' },
    { id: 'orcmount', name: 'Orc Mountains', sub: 'Iron clans and their war beasts', castle: 2,
      pal: { g1: '#7d7060', g2: '#8c7f6c', g3: '#685d50', path: '#b3a184', edge: '#4f4538', accent: '#e0a868' }, decor: 'rocks',
      pool: [{ t: 'orc', from: 0, w: 6 }, { t: 'goblin', from: 0, w: 4 }, { t: 'wolf', from: 0, w: 4 }, { t: 'sapper', from: 1, w: 3 }, { t: 'troll', from: 3, w: 1 }], boss: 'orcWarlord' },
    { id: 'swamp', name: 'Cursed Swamp', sub: 'Where the drowned dead still walk', castle: 3,
      pal: { g1: '#36503f', g2: '#41604a', g3: '#2a4033', path: '#6e5d47', edge: '#2f271d', accent: '#9be38e' }, decor: 'swamp',
      pool: [{ t: 'skeleton', from: 0, w: 6 }, { t: 'spider', from: 0, w: 5 }, { t: 'skeletonMage', from: 1, w: 3 }, { t: 'bat', from: 1, w: 3 }, { t: 'troll', from: 3, w: 1 }], boss: 'broodmother' },
    { id: 'frozen', name: 'Frozen Empire', sub: 'Ice-locked halls of a fallen order', castle: 4,
      pal: { g1: '#cfdcea', g2: '#e1ebf4', g3: '#b5c7d9', path: '#8498ae', edge: '#4d5f74', accent: '#a8dcff' }, decor: 'snow',
      pool: [{ t: 'wolf', from: 0, w: 5 }, { t: 'skeleton', from: 0, w: 5 }, { t: 'darkKnight', from: 1, w: 3 }, { t: 'skeletonMage', from: 1, w: 3 }, { t: 'ogre', from: 3, w: 1 }], boss: 'frostGiant' },
    { id: 'dark', name: 'Dark Kingdom', sub: 'The usurper\'s black citadel', castle: 5,
      pal: { g1: '#3b3346', g2: '#463c54', g3: '#2e2838', path: '#655a6e', edge: '#211b29', accent: '#c79bff' }, decor: 'dark',
      pool: [{ t: 'darkKnight', from: 0, w: 5 }, { t: 'imp', from: 0, w: 5 }, { t: 'skeletonMage', from: 0, w: 3 }, { t: 'spider', from: 1, w: 3 }, { t: 'ogre', from: 2, w: 1 }], boss: 'demonLord' },
    { id: 'dragon', name: 'Dragon\'s Territory', sub: 'Ash, obsidian and the last great wyrm', castle: 6,
      pal: { g1: '#4a2e26', g2: '#58372c', g3: '#38221c', path: '#6a4a3e', edge: '#1e1210', accent: '#ff9a5a' }, decor: 'lava',
      pool: [{ t: 'imp', from: 0, w: 5 }, { t: 'whelp', from: 0, w: 3 }, { t: 'darkKnight', from: 0, w: 4 }, { t: 'troll', from: 1, w: 1 }, { t: 'ogre', from: 2, w: 1 }], boss: 'dragon' },
  ];

  /* Campaign map templates. Path end tiles touch the building they attack. */
  const TEMPLATES = {
    A: { paths: [{ pts: [[-1, 4], [7, 4], [7, 17], [15, 17], [15, 5], [22, 5], [22, 10]], to: 'core' }], objs: [] },
    B: { paths: [{ pts: [[-1, 3], [11, 3], [11, 10], [22, 10]], to: 'core' }, { pts: [[-1, 18], [11, 18], [11, 10], [22, 10]], to: 'core' }], objs: [] },
    C: { paths: [{ pts: [[-1, 10], [6, 10], [6, 4], [22, 4], [22, 9]], to: 'core' }, { pts: [[-1, 13], [3, 13], [3, 20], [11, 20], [11, 17], [14, 17]], to: 'objA' }], objs: [{ key: 'objA', type: 'goldMine', tx: 15, ty: 16 }] },
    D: { paths: [{ pts: [[-1, 10], [6, 10], [6, 4], [22, 4], [22, 9]], to: 'core' }, { pts: [[-1, 13], [3, 13], [3, 20], [11, 20], [11, 17], [14, 17]], to: 'objA' }, { pts: [[30, 15], [27, 15], [27, 20], [22, 20], [22, 15]], to: 'objB' }],
      objs: [{ key: 'objA', type: 'outpost', tx: 15, ty: 16 }, { key: 'objB', type: 'outpost', tx: 21, ty: 13 }] },
  };
  const CORE = { tx: 23, ty: 9 };

  function mirror(t) {
    const mx = x => 29 - x;
    return {
      core: { tx: 30 - CORE.tx - 3, ty: CORE.ty },
      paths: t.paths.map(p => ({ to: p.to, pts: p.pts.map(([x, y]) => [mx(x), y]) })),
      objs: t.objs.map(o => ({ ...o, tx: 30 - o.tx - 2 })),
    };
  }

  const STAGE_PLAN = [
    { obj: 'survive', tpl: 'A', title: 'Hold the line' },
    { obj: 'protect', tpl: 'C', title: 'Guard the mine' },
    { obj: 'timed', tpl: 'B', title: 'Swift justice' },
    { obj: 'survive', tpl: 'B', title: 'Pincer attack' },
    { obj: 'multi', tpl: 'D', title: 'Three fronts' },
    { obj: 'boss', tpl: 'A', title: 'Boss battle' },
  ];
  CH.OBJECTIVES = {
    survive: 'Survive every wave.',
    protect: 'Keep the castle standing and protect the gold mine. Losing the mine costs stars.',
    timed: 'Defeat every enemy before time runs out.',
    multi: 'Defend the castle and both outposts. Losing any of them means defeat.',
    boss: 'Defeat the boss that leads the final wave.',
  };

  const cache = {};
  function stage(r, s) {
    const key = r + '-' + s;
    if (cache[key]) return cache[key];
    const reg = CH.REGIONS[r], plan = STAGE_PLAN[s];
    const gi = r * 6 + s;
    const rnd = U.rng(5003 + gi * 977);
    const base = TEMPLATES[plan.tpl];
    const tpl = (r + s) % 2 ? mirror(base) : { core: CORE, paths: base.paths, objs: base.objs };
    const nWaves = 5 + Math.floor(s / 2) + Math.floor(r / 2);
    const pool = reg.pool.filter(p => p.from <= s);
    const waves = [];
    for (let w = 0; w < nWaves; w++) {
      const budget = (4 + 3.2 * w + 0.45 * w * w) * (1 + 0.1 * r) * (s >= 4 ? 1.1 : 1);
      const groups = [];
      const nG = 1 + (w >= 2 ? 1 : 0) + (w >= 5 ? 1 : 0);
      let delay = 0;
      for (let k = 0; k < nG; k++) {
        const share = budget / nG;
        const opts = pool.filter(p => (CH.ENEMIES[p.t].threat || 1) <= Math.max(4, share / 2));
        const tot = opts.reduce((a, p) => a + p.w, 0);
        let pick = rnd() * tot, choice = opts[0];
        for (const p of opts) { pick -= p.w; if (pick <= 0) { choice = p; break; } }
        const def = CH.ENEMIES[choice.t];
        const count = U.clamp(Math.round(share / (def.threat || 1)), 1, 30);
        groups.push({ type: choice.t, count, interval: U.clamp(1.1 / def.speed, 0.35, 1.2), delay, path: (w + k) % tpl.paths.length });
        delay += count * 0.4 + 2;
      }
      if (plan.obj === 'boss' && w === nWaves - 1) groups.push({ type: reg.boss, count: 1, interval: 1, delay: delay + 2, path: 0, boss: true });
      waves.push({ groups });
    }
    const baseR = 220 + 160 * gi;
    const st = {
      id: key, r, s, gi, name: plan.title, obj: plan.obj, region: reg, tpl, waves,
      hpMult: 1 + 0.055 * gi + 0.0012 * gi * gi,
      startGold: 400 + 80 * r + 25 * s,
      timeLimit: plan.obj === 'timed' ? 34 * nWaves + 45 : 0,
      reward: { gold: baseR, wood: baseR, stone: Math.round(baseR * 0.6), xp: 30 + 12 * gi, gems: s === 5 ? 6 + r : 0, runes: s === 5 ? 1 + Math.floor(r / 2) : (s === 4 ? 1 : 0) },
    };
    cache[key] = st;
    return st;
  }

  CH.Campaign = {
    STAGES: 6,
    stage,
    regionUnlocked(save, r) {
      if (r === 0) return true;
      return CH.State.castleLevel(save) >= CH.REGIONS[r].castle && !!save.campaign[(r - 1) + '-5'];
    },
    stageUnlocked(save, r, s) {
      if (!this.regionUnlocked(save, r)) return false;
      return s === 0 || !!save.campaign[r + '-' + (s - 1)];
    },
  };

  /* ------------------------------------------------------------------
   * ENDLESS RAID — AI kingdoms generated from a seed.
   * Every opponent can be attacked once, then it leaves the list.
   * ---------------------------------------------------------------- */
  const ARCH = {
    beginner: { name: 'Beginner village', defMult: 0.5, lvl: -1, rings: 0, loot: 0.8, res: 1, desc: 'Barely defended. Easy pickings.' },
    resource: { name: 'Resource hoard', defMult: 0.6, lvl: 0, rings: 1, loot: 1.7, res: 1.6, desc: 'Overflowing storehouses guarded lightly.' },
    balanced: { name: 'Balanced kingdom', defMult: 0.85, lvl: 0, rings: 1, loot: 1.1, res: 1, desc: 'A well-rounded base.' },
    heavy: { name: 'Heavy defenses', defMult: 1.0, lvl: 0, rings: 2, loot: 0.95, res: 0.8, desc: 'Defenses packed behind two wall rings.' },
    fortress: { name: 'High fortress', defMult: 1.0, lvl: 1, rings: 2, loot: 1.6, res: 1.2, gems: true, desc: 'Strong and rich. Holds rare gems.' },
  };
  const SYL1 = ['Ash', 'Iron', 'Raven', 'Thorn', 'Storm', 'Gold', 'Black', 'Frost', 'Wolf', 'Ember', 'Stone', 'Silver', 'Bram', 'Oak', 'Grim'];
  const SYL2 = ['hold', 'vale', 'mere', 'keep', 'ford', 'watch', 'gate', 'crest', 'reach', 'fall', 'helm', 'moor', 'spire'];
  const LORDS = ['Baron', 'Countess', 'Warlord', 'Duke', 'Lady', 'Jarl', 'Chieftain', 'Margrave'];
  const NAMES = ['Ulric', 'Morgana', 'Hask', 'Edda', 'Torvin', 'Seren', 'Bregor', 'Ilsa', 'Corvin', 'Wren'];

  function generateOpponent(seed, playerCL, trophies) {
    const rnd = U.rng(seed);
    const tier = Math.floor(trophies / 200);
    const weights = { beginner: Math.max(0, 5 - tier * 2), resource: 3, balanced: 4, heavy: 2 + tier, fortress: Math.max(0, tier - 1) + (playerCL >= 3 ? 1 : 0) };
    let tot = 0; for (const k in weights) tot += weights[k];
    let pk = rnd() * tot, archKey = 'balanced';
    for (const k in weights) { pk -= weights[k]; if (pk <= 0) { archKey = k; break; } }
    const arch = ARCH[archKey];
    const cl = U.clamp(playerCL - 1 + Math.floor(rnd() * 2) + arch.lvl + Math.min(2, Math.floor(tier / 2)), 1, 8);
    const layout = layoutFor(rnd, cl, arch);
    // Loot available is scaled to the PLAYER's level so raids stay useful but can't snowball.
    const pool = (260 + 360 * Math.pow(playerCL, 1.6)) * arch.loot;
    const loot = { gold: Math.round(pool), wood: Math.round(pool), stone: Math.round(pool * 0.65), gems: arch.gems ? 2 + Math.floor(rnd() * 4) : 0 };
    const diff = Math.round((layout.filter(b => CH.BUILDINGS[b.type].cat === 'defense').reduce((a, b) => a + b.level, 0)) / Math.max(1, playerCL));
    return {
      id: 'op' + seed, seed, archetype: archKey, archName: arch.name, archDesc: arch.desc, cl,
      name: U.pick(SYL1, rnd) + U.pick(SYL2, rnd), lord: U.pick(LORDS, rnd) + ' ' + U.pick(NAMES, rnd),
      layout, loot, trophyWin: 14 + Math.floor(rnd() * 8) + (cl - playerCL) * 4, trophyLoss: 10 + Math.floor(rnd() * 5), threat: diff,
    };
  }

  function layoutFor(rnd, cl, arch) {
    const [aw, ah] = C.AREA[cl - 1];
    const x0 = Math.floor((C.COLS - aw) / 2), y0 = Math.floor((C.ROWS - ah) / 2);
    const occ = new Uint8Array(C.COLS * C.ROWS);
    const out = [];
    const maxL = (type) => Math.min(CH.BUILDINGS[type].maxLevel, cl + 1);
    const lvlFor = type => U.clamp(cl + arch.lvl - (rnd() < 0.5 ? 1 : 0), 1, maxL(type));
    const free = (tx, ty, s) => {
      if (tx < x0 || ty < y0 || tx + s > x0 + aw || ty + s > y0 + ah) return false;
      for (let y = ty; y < ty + s; y++) for (let x = tx; x < tx + s; x++) if (occ[y * C.COLS + x]) return false;
      return true;
    };
    const put = (type, tx, ty, level) => {
      const s = CH.BUILDINGS[type].size;
      for (let y = ty; y < ty + s; y++) for (let x = tx; x < tx + s; x++) occ[y * C.COLS + x] = 1;
      out.push({ type, level, tx, ty });
    };
    const placeIn = (type, rect, level) => {
      const s = CH.BUILDINGS[type].size;
      for (let i = 0; i < 300; i++) {
        const tx = rect.x + Math.floor(rnd() * Math.max(1, rect.w - s + 1)), ty = rect.y + Math.floor(rnd() * Math.max(1, rect.h - s + 1));
        if (free(tx, ty, s)) { put(type, tx, ty, level); return true; }
      }
      return false;
    };
    const cx = Math.floor(C.COLS / 2) - 1, cy = Math.floor(C.ROWS / 2) - 1;
    put('castle', cx, cy, cl);
    const r = 2 + Math.floor(cl / 2);
    const inner = { x: cx - r, y: cy - r, w: 3 + 2 * r, h: 3 + 2 * r };
    const whole = { x: x0, y: y0, w: aw, h: ah };
    // Reserve the wall rings so buildings don't sit on them.
    const ringRects = [];
    if (arch.rings >= 1) ringRects.push({ x: inner.x - 1, y: inner.y - 1, w: inner.w + 2, h: inner.h + 2 });
    if (arch.rings >= 2) ringRects.push({ x: inner.x - 4, y: inner.y - 4, w: inner.w + 8, h: inner.h + 8 });
    const ringTiles = [];
    for (const R of ringRects) {
      for (let x = R.x; x < R.x + R.w; x++) for (const y of [R.y, R.y + R.h - 1]) ringTiles.push([x, y]);
      for (let y = R.y + 1; y < R.y + R.h - 1; y++) for (const x of [R.x, R.x + R.w - 1]) ringTiles.push([x, y]);
    }
    const inArea = (x, y) => x >= x0 && y >= y0 && x < x0 + aw && y < y0 + ah;
    for (const [x, y] of ringTiles) if (inArea(x, y)) occ[y * C.COLS + x] = 2;
    const innerFree = { x: inner.x, y: inner.y, w: inner.w, h: inner.h };

    // Defenses
    for (const t of CH.BUILD_MENU[2].types) {
      const d = CH.BUILDINGS[t];
      if (d.unlock > cl) continue;
      const n = Math.max(t === 'archerTower' ? 1 : 0, Math.round(d.counts[cl - 1] * arch.defMult));
      for (let i = 0; i < n; i++) {
        const zone = arch.rings && (i % 3 !== 2 || archKeyHeavy(arch)) ? innerFree : whole;
        if (!placeIn(t, zone, lvlFor(t))) placeIn(t, whole, lvlFor(t));
      }
    }
    // Storages: inside the walls for defensive bases, outside for resource hoards.
    for (const t of ['goldStorage', 'woodStorage', 'stoneStorage']) {
      const n = Math.max(1, Math.round(CH.BUILDINGS[t].counts[cl - 1] * Math.min(1.5, arch.res)));
      for (let i = 0; i < n; i++) placeIn(t, arch.res > 1.2 ? whole : innerFree, lvlFor(t)) || placeIn(t, whole, lvlFor(t));
    }
    for (const t of ['goldMine', 'lumberMill', 'stoneQuarry']) {
      const n = Math.max(1, Math.round(CH.BUILDINGS[t].counts[cl - 1] * arch.res));
      for (let i = 0; i < n; i++) placeIn(t, whole, lvlFor(t));
    }
    placeIn('barracks', whole, lvlFor('barracks'));
    placeIn('builderHut', whole, 1); placeIn('builderHut', whole, 1);
    if (cl >= 2) placeIn('heroHall', whole, Math.min(5, lvlFor('heroHall')));
    if (cl >= 3) placeIn('lab', whole, Math.min(5, lvlFor('lab')));
    // Walls
    let walls = CH.BUILDINGS.wall.counts[cl - 1];
    const wl = U.clamp(cl + arch.lvl, 1, 8);
    for (const [x, y] of ringTiles) {
      if (walls <= 0) break;

      occ[y * C.COLS + x] = 1;
      out.push({ type: 'wall', level: wl, tx: x, ty: y });
      walls--;

      const d = CH.BUILDINGS[t];

      const n = Math.round(d.counts[cl - 1] * arch.defMult);
      for (let i = 0; i < n; i++) placeIn(t, { x: inner.x - 3, y: inner.y - 3, w: inner.w + 6, h: inner.h + 6 }, Math.min(5, cl));

    for (let y = 0; y < C.ROWS; y++) for (let x = 0; x < C.COLS; x++) if (occ[y * C.COLS + x] === 2) occ[y * C.COLS + x] = 0;

  CH.Raid = {
    ARCH,
    /** Base layout for a world kingdom (deterministic from seed). */
    layout: (seed, cl, archKey) => layoutFor(U.rng(seed), cl, ARCH[archKey] || ARCH.balanced),
    generate: generateOpponent,
    searchCost: cl => 30 * cl,
    /** Builds a fresh list of opponents; seeds advance so the same base never comes back. */
    refresh(save) {
      const cl = CH.State.castleLevel(save);
      save.raid.opponents = [];
      for (let i = 0; i < 4; i++) save.raid.opponents.push(generateOpponent(save.raid.seed++, cl, save.raid.trophies));
    },
    league: t => (t < 100 ? 'Bronze' : t < 300 ? 'Silver' : t < 600 ? 'Gold' : t < 1000 ? 'Crystal' : 'Champion'),
  };

  /* ------------------------------------------------------------------
   * ENDLESS DEFENSE — AI waves attack the player's real base layout.
   * ---------------------------------------------------------------- */
  const D_POOL = [
    { t: 'goblin', from: 1, w: 6 }, { t: 'wolf', from: 2, w: 5 }, { t: 'orc', from: 3, w: 4 }, { t: 'bat', from: 4, w: 3 },
    { t: 'sapper', from: 5, w: 3 }, { t: 'skeleton', from: 6, w: 4 }, { t: 'spider', from: 8, w: 3 }, { t: 'skeletonMage', from: 9, w: 3 },
    { t: 'darkKnight', from: 12, w: 3 }, { t: 'imp', from: 14, w: 3 }, { t: 'whelp', from: 16, w: 2 }, { t: 'troll', from: 18, w: 1 },
  ];
  const BOSSES = ['trollChief', 'orcWarlord', 'broodmother', 'frostGiant', 'demonLord', 'dragon'];
  const MODS = [
    { id: 'swift', name: 'Swift', desc: 'Enemies move 25% faster.' },
    { id: 'ironclad', name: 'Ironclad', desc: 'Enemies have 30% more health.' },
    { id: 'frenzy', name: 'Frenzy', desc: 'Enemies deal 30% more damage.' },
    { id: 'swarm', name: 'Swarm', desc: '50% more enemies.' },
  ];

  CH.Defense = {
    MODS,
    wave(n) {
      const rnd = U.rng(777 + n * 131);
      const isBoss = n % 10 === 0 && n >= 20;
      const isMini = n % 5 === 0 && !isBoss && n >= 10;
      const mod = n > 20 ? MODS[Math.floor(rnd() * MODS.length)] : null;
      let budget = 4 + 2.6 * n + 0.17 * n * n;
      if (mod && mod.id === 'swarm') budget *= 1.5;
      const pool = D_POOL.filter(p => p.from <= n);
      const nG = Math.min(4, 1 + Math.floor(n / 6));
      const edges = ['N', 'S', 'E', 'W'];

        let pk = rnd() * tot, ch = pool[0];
        for (const p of pool) { pk -= p.w; if (pk <= 0) { ch = p; break; } }
        const def = CH.ENEMIES[ch.t];
        groups.push({ type: ch.t, count: U.clamp(Math.round(budget / nG / def.threat), 1, 28), edge: U.pick(edges, rnd), delay: k * 3, interval: 0.4 });
      }
      if (isMini) groups.push({ type: n % 10 === 0 ? 'ogre' : 'troll', count: 1 + Math.floor(n / 25), edge: U.pick(edges, rnd), delay: 4, interval: 1.5, elite: true });
      if (isBoss) groups.push({ type: BOSSES[(n / 10 - 2) % BOSSES.length], count: 1, edge: U.pick(edges, rnd), delay: 5, interval: 1, boss: true });

      return { n, groups, mult, mod, isBoss, isMini };
    },
    rewards(n) {
      return {
        gold: 45 + 18 * n, wood: 45 + 18 * n, stone: 28 + 11 * n, xp: 6 + 2 * n,
        runes: n % 5 === 0 ? 1 + Math.floor(n / 15) : 0, gems: n % 10 === 0 && n >= 20 ? 3 : 0,
      };
    },
    MILESTONES: [{ wave: 5, gems: 5, runes: 1 }, { wave: 10, gems: 10, runes: 2 }, { wave: 20, gems: 20, runes: 4 }, { wave: 30, gems: 30, runes: 6 }, { wave: 50, gems: 50, runes: 10 }],
    BOONS: [
      { id: 'repair', name: 'Master Masons', desc: 'Rebuild destroyed buildings and restore 50% health to all.' },
      { id: 'fortify', name: 'Fortify', desc: 'All defenses deal 20% more damage for the rest of the run.' },
      { id: 'rally', name: 'Rally the Heroes', desc: 'Fully heal and revive your heroes, and refill spell charges.' },
      { id: 'tribute', name: 'Royal Tribute', desc: 'Bank a big resource bonus right now.' },
      { id: 'quickdraw', name: 'Quick Draw', desc: 'All defenses attack 15% faster for the rest of the run.' },
    ],
  };

  /* ------------------------------------------------------------------ */
  CH.START_LAYOUT = [
    { type: 'castle', level: 1, tx: 13, ty: 9 },
    { type: 'builderHut', level: 1, tx: 9, ty: 6 },
    { type: 'goldMine', level: 1, tx: 17, ty: 6 },
    { type: 'lumberMill', level: 1, tx: 9, ty: 13 },
    { type: 'farm', level: 1, tx: 11, ty: 6 },
    { type: 'barracks', level: 1, tx: 18, ty: 10 },
    { type: 'archeryRange', level: 1, tx: 10, ty: 10 },
    { type: 'heroHall', level: 1, tx: 15, ty: 13 },
    { type: 'infirmary', level: 1, tx: 12, ty: 13 },
    { type: 'archerTower', level: 1, tx: 17, ty: 13 },
    { type: 'tree', level: 1, tx: 19, ty: 15 },
    { type: 'rock', level: 1, tx: 20, ty: 6 },
    { type: 'rock', level: 1, tx: 14, ty: 6 },
  ];
})();

/* =====================================================================
 * Eldoria — data/codes.js
 * REDEEM CODES. Each entry stores a HASH of the code, not the code itself,
 * so players can't simply read valid codes from the page source.
 *
 * To add a code:  node tools/codegen.js MYCODE2026
 * then paste the printed line into CH.REDEEM_CODES below and rebuild.
 *
 * reward: gold, wood, stone, food, gems, runes, xp, troops: { swordsman: 10 }, items: { shield8h: 1 }, heroes: ['elara'] (unlock)
 *         (redeem rewards may exceed storage limits; they are a gift)
 * start / expires: optional 'YYYY-MM-DD' dates (expires = last valid day)
 * minCastle: optional minimum castle level
 * Each code can be redeemed once per save.
 * ===================================================================== */

/** Small, fast non-cryptographic hash (cyrb53). Obfuscation, not security. */
CH.hashCode = function (code) {
  const str = 'crownhold:' + String(code).trim().toUpperCase().replace(/\s+/g, '');
  let h1 = 0xdeadbeef ^ 7, h2 = 0x41c6ce57 ^ 7;
  for (let i = 0; i < str.length; i++) {
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
};

CH.REDEEM_CODES = [
  // ELDORIA
  {hash: "d9d5e6d8852a8", label: "Welcome to Eldoria", reward: {gold: 5000, wood: 5000, stone: 3000, food: 8000, gems: 100}},
  // WARCHEST
  {hash: "7efbedcb728b5", label: "War chest", reward: {gold: 10000, food: 10000, troops: {swordsman: 500, archer: 300, lightCavalry: 200}}},
  // SAFEHAVEN
  {hash: "171f90d5312e06", label: "Safe haven", reward: {gems: 50, items: {shield8h: 2, teleRandom: 1, teleAdvanced: 1, speed1h: 3}}},
  // DRAGONFIRE
  {hash: "131953c0355b25", label: "Dragonfire hoard", reward: {gems: 200, runes: 10, troops: {knight: 200}}, minCastle: 4},
];

  <script>/* js/core/state.js */
/* =====================================================================
 * Eldoria — core/state.js
 * Everything about the persistent kingdom: resources, buildings,
 * construction timers, production, army training, research, heroes,
 * player level and saving. Pure logic (no DOM) so Node tests can use it.
 * Timers are wall-clock timestamps, so they keep running while offline.
 * ===================================================================== */
CH.State = (function () {
  const C = CH.CONFIG, B = CH.BUILDINGS, U = CH.util;
  const RES = ['gold', 'wood', 'stone', 'food'];

  function defaults(now = Date.now()) {
    const troops = {}; for (const t of CH.TROOP_ORDER) troops[t] = 1;
    const spells = {}; for (const s of CH.SPELL_ORDER) spells[s] = 1;
    const heroes = {}; for (const h of CH.HERO_ORDER) heroes[h] = { unlocked: h === 'aldric', level: 1, xp: 0 };
    const techs = {}; for (const t of CH.TECH_ORDER) techs[t] = 0;
    const buildings = CH.START_LAYOUT.map((b, i) => ({ id: i + 1, type: b.type, level: b.level, tx: b.tx, ty: b.ty, buf: 0, job: null }));

      version: 1, res: { ...C.START_RES }, buildings, nextId: buildings.length + 1,
      army: { swordsman: 300, archer: 200, lightCavalry: 100 }, train: [], trainJobs: {}, wounded: {}, healJob: null,
      research: { troops, spells, techs }, rjob: null, heroes, defenseHero: 'aldric',
      items: { shield8h: 1, teleRandom: 1, teleAdvanced: 1, speed5m: 5, speed1h: 1 },
      skins: { castle: ['classic'], hero: {} }, equipped: { castle: 'classic', hero: {} }, extraMarch: 0,
      shieldUntil: 0, createdAt: now, faction: null, factionChangedAt: 0, helpUsedAt: 0, reports: [], unread: 0, world: null,
      campaign: {}, raid: { trophies: 0, seed: 1000 + Math.floor(Math.random() * 1e6), opponents: [], wins: 0, attacks: 0 },
      defense: { best: 0, runs: 0, claimed: [] },
      player: { name: 'Lord of Eldoria', xp: 0, level: 1 },
      stats: { battlesWon: 0, enemiesSlain: 0, buildingsRaided: 0, obstaclesCleared: 0, attacksWon: 0, attacksLost: 0, defensesWon: 0, defensesLost: 0, troopsLost: 0, resourcesLooted: 0, monstersSlain: 0, deserted: 0, kills: 0 },
      settings: { music: 0.45, sfx: 0.7, muted: false, damageNumbers: true },

  /* ---------- Queries ---------- */

  const highestLevel = (s, type) => s.buildings.filter(b => b.type === type).reduce((m, b) => Math.max(m, b.level), 0);
  const buildingLevel = (s, type) => highestLevel(s, type);

  function capacity(s, r) {
    if (r === 'gems' || r === 'runes') return Infinity;
    let cap = B.castle.cap(castleLevel(s));
    for (const b of s.buildings) if (B[b.type].cat === 'storage' && B[b.type].res === r && b.level > 0) cap += B[b.type].cap(b.level);
    return cap;
  }
  /** Production multiplier from Prosperity research, faction and captured territory. */
  function prodMult(s) {
    let m = 1 + 0.05 * ((s.research.techs || {}).prosperity || 0);
    if (s.faction != null && CH.FACTIONS && CH.FACTIONS[s.faction].bonus.prod) m += CH.FACTIONS[s.faction].bonus.prod;
    if (CH.World && s.world) m += CH.World.territoryBonus(s);
    if (CH.Throne && s.world && CH.Throne.isPlayerKing(s)) m += CH.THRONE.kingBonus.prod;
    return m;
  }
  function productionPerMin(s, r) {
    let p = 0;
    for (const b of s.buildings) if (B[b.type].cat === 'econ' && B[b.type].res === r && b.level > 0) p += B[b.type].prod(b.level);
    return p * prodMult(s);
  }
  /** Food eaten per hour by every troop you own (home, marching and wounded). */
  function upkeepPerHour(s) {
    const agri = 1 - 0.05 * ((s.research.techs || {}).agriculture || 0);
    let n = 0;
    const add = army => { for (const t in army) if (CH.TROOPS[t]) n += army[t] * CH.TROOPS[t].upkeep; };
    add(s.army); add(s.wounded || {});
    if (s.world) for (const m of s.world.marches) if (m.owner === 'player') add(m.army);

  /** Resources a raider can never take: 1000 per castle level + 25% of each storage building. */
  function protectedAmount(s, r) {

    return p;
  }
  const builders = s => s.buildings.filter(b => b.type === 'builderHut' && b.level > 0).length;
  const busy = s => s.buildings.filter(b => b.job).length;
  const freeBuilders = s => builders(s) - busy(s);

  function canAfford(s, cost) { return RES.every(r => (cost[r] || 0) <= s.res[r]) && (cost.gems || 0) <= s.res.gems && (cost.runes || 0) <= s.res.runes; }
  function pay(s, cost) { for (const r of [...RES, 'gems', 'runes']) s.res[r] -= cost[r] || 0; }
  /** Adds resources, respecting storage caps. Returns what was actually added. */

  /* ---------- Player level ---------- */
  const xpFor = L => Math.round(80 * Math.pow(L, 1.55));

      s.player.level++;
      const gems = 3 + Math.floor(s.player.level / 2);
      s.res.gems += gems;
      ups.push({ level: s.player.level, gems });

  }

  /* ---------- Placement ---------- */
  function tilesFree(s, tx, ty, size, ignoreId) {
    const a = area(s);
    if (tx < a.x || ty < a.y || tx + size > a.x + a.w || ty + size > a.y + a.h) return false;
    for (const b of s.buildings) {
      if (b.id === ignoreId) continue;
      const bs = B[b.type].size;
      if (tx < b.tx + bs && tx + size > b.tx && ty < b.ty + bs && ty + size > b.ty) return false;

  function buildBlocker(s, type) {

    if (d.requires && !highestLevel(s, d.requires)) return 'Needs a ' + B[d.requires].name;

    if (!canAfford(s, buildCost(s, type))) return 'Not enough resources';

    if (b.level >= d.maxLevel) return 'Maximum level';
    if (b.level >= maxLevelFor(s, b.type)) return 'Upgrade the castle first';
    if (d.requires && b.level >= highestLevel(s, d.requires)) return 'Upgrade the ' + B[d.requires].name + ' first';

    if (d.instant) { b.level = L; addXp(s, 2 + L); return { ok: true, instant: true }; }
    b.job = { kind: 'upgrade', to: L, ends: now + d.time(L) * 1000, total: d.time(L) };

  function move(s, id, tx, ty) {
    const b = byId(s, id);

    if (!canAfford(s, cl.cost)) return { ok: false, reason: 'Not enough resources' };

  function collectAll(s) {
    const got = { gold: 0, wood: 0, stone: 0 };

  }

  /* ---------- Army ---------- */
  const barracksLevel = s => highestLevel(s, 'barracks');
  /** Each military building trains one batch at a time. */
  const batchCap = (s, bld) => (highestLevel(s, bld) ? B[bld].batch(highestLevel(s, bld)) : 0);
  const trainTimeEach = (s, type) => CH.TROOPS[type].time * (1 - 0.04 * (highestLevel(s, CH.TROOPS[type].building) - 1));
  function trainCost(type, n) { const c = CH.TROOPS[type].cost; return { gold: c.gold * n, wood: c.wood * n, stone: c.stone * n, food: c.food * n }; }
  function trainBlocker(s, type, n = 1) {
    const d = CH.TROOPS[type], lvl = highestLevel(s, d.building);
    if (!lvl) return 'Build a ' + B[d.building].name + ' first';
    if (lvl < d.unlock) return 'Needs ' + B[d.building].name + ' level ' + d.unlock;
    if (s.trainJobs[d.building]) return B[d.building].name + ' is busy';
    if (n < 1) return 'Choose an amount';
    if (n > batchCap(s, d.building)) return 'Max ' + batchCap(s, d.building) + ' per batch';
    if (!canAfford(s, trainCost(type, n))) return 'Not enough resources';
    return null;
  }
  function train(s, type, n = 1, now = Date.now()) {
    n = Math.floor(n);
    const why = trainBlocker(s, type, n);

    pay(s, trainCost(type, n));
    const total = Math.max(1, Math.round(trainTimeEach(s, type) * n));

  }
  function cancelTrain(s, bld) {
    const j = s.trainJobs[bld]; if (!j) return false;

  }
  /** Infirmary */
  const beds = s => Math.floor(s.buildings.filter(b => b.type === 'infirmary' && b.level > 0).reduce((a, b) => a + B.infirmary.beds(b.level), 0) * (1 + 0.12 * ((s.research.techs || {}).medicine || 0)));
  const woundedCount = s => Object.values(s.wounded || {}).reduce((a, n) => a + n, 0);
  /** Adds casualties: wounded go to the infirmary while beds last, the rest die. Returns {wounded, dead}. */
  function addCasualties(s, lost) {
    let free = Math.max(0, beds(s) - woundedCount(s)), w = 0, dead = 0;
    for (const t in lost) {
      const n = lost[t]; if (!n) continue;
      const k = Math.min(free, n); free -= k; w += k; dead += n - k;

  }
  function healCost(s) { let c = { gold: 0, wood: 0, stone: 0, food: 0 }; for (const t in s.wounded) { const k = trainCost(t, s.wounded[t]); for (const r of RES) c[r] += Math.ceil(k[r] * 0.4); } return c; }
  function healTime(s) { let tm = 0; for (const t in s.wounded) tm += CH.TROOPS[t].time * s.wounded[t] * 0.35; return Math.max(1, Math.round(tm * (1 - 0.1 * ((s.research.techs || {}).medicine || 0)))); }
  function heal(s, now = Date.now()) {
    if (s.healJob) return { ok: false, reason: 'Already healing' };
    if (!woundedCount(s)) return { ok: false, reason: 'No wounded troops' };
    const c = healCost(s);
    if (!canAfford(s, c)) return { ok: false, reason: 'Not enough resources' };
    pay(s, c);
    const total = healTime(s);
    s.healJob = { army: { ...s.wounded }, ends: now + total * 1000, total };
    s.wounded = {};
    return { ok: true };
  }
  /** Items */
  function useItem(s, id, now = Date.now(), target) {
    const it = CH.ITEMS[id];
    if (!it || !(s.items[id] > 0)) return { ok: false, reason: 'You have none' };
    if (it.kind === 'shield') { s.shieldUntil = Math.max(s.shieldUntil, now) + it.ms; if (CH.World && s.world) CH.World.onShield(s, now); }
    else if (it.kind === 'res') { for (const r in it.res) s.res[r] += it.res[r]; }
    else if (it.kind === 'speed') { if (!applySpeed(s, target, it.sec * 1000, now)) return { ok: false, reason: 'Nothing to speed up' }; }
    else if (it.kind === 'teleport') return { ok: false, reason: 'Use teleports from the world map' };
    s.items[id]--;
    return { ok: true };
  }
  /** target: {kind:'building', id} | {kind:'train', bld} | {kind:'research'} | {kind:'heal'} */
  function applySpeed(s, target, ms, now) {
    let job = null;
    if (!target) return false;
    if (target.kind === 'building') { const b = byId(s, target.id); job = b && b.job; }
    else if (target.kind === 'train') job = s.trainJobs[target.bld];
    else if (target.kind === 'research') job = s.rjob;
    else if (target.kind === 'heal') job = s.healJob;
    if (!job) return false;
    job.ends = Math.max(now, job.ends - ms);
    return true;
  }
  function gemFinishCost(job, now = Date.now()) { return job ? Math.max(1, Math.ceil((job.ends - now) / 1000 / 30)) : 0; }
  function gemFinish(s, target, now = Date.now()) {
    const job = target.kind === 'train' ? s.trainJobs[target.bld] : target.kind === 'research' ? s.rjob : target.kind === 'heal' ? s.healJob : null;
    if (!job) return false;
    const c = gemFinishCost(job, now);
    if (s.res.gems < c) return false;
    s.res.gems -= c; job.ends = now;
    return true;
  }
  /** Gem shop. kind: 'res' (r, i = pack index) | 'fill' (r) | 'item' (id). */
  function shopPrice(s, kind, a, b) {
    if (kind === 'res') return CH.GEM_SHOP.resources[b].gems;
    if (kind === 'fill') return Math.ceil(Math.max(0, capacity(s, a) - s.res[a]) / CH.GEM_SHOP.fillPerGem);
    return CH.GEM_SHOP.items[a];
  }
  function buy(s, kind, a, b) {
    const price = shopPrice(s, kind, a, b);
    if (kind === 'fill' && price <= 0) return { ok: false, reason: 'Your ' + a + ' storage is already full' };
    if (!(price > 0)) return { ok: false, reason: 'Not for sale' };
    if (s.res.gems < price) return { ok: false, reason: 'Not enough gems (' + price + ' needed)' };
    s.res.gems -= price;
    let got;
    if (kind === 'res') { got = Math.round(CH.GEM_SHOP.resources[b].amount * (a === 'food' ? CH.GEM_SHOP.foodBonus : 1)); s.res[a] += got; }
    else if (kind === 'fill') { got = Math.floor(capacity(s, a) - s.res[a]); s.res[a] += got; }
    else { s.items[a] = (s.items[a] || 0) + 1; got = 1; }
    return { ok: true, got, price };
  }
  const shielded = (s, now = Date.now()) => s.shieldUntil > now;
  const beginner = (s, now = Date.now()) => castleLevel(s) < 3 && now - (s.createdAt || now) < C.BEGINNER_MIN * 60000;
  /** Total military + development power, shown everywhere and used for AI matchmaking. */
  function power(s) {
    let p = 0;
    const add = a => { for (const t in a) if (CH.TROOPS[t]) p += a[t] * CH.TROOPS[t].power; };
    add(s.army); if (s.world) for (const m of s.world.marches) if (m.owner === 'player') add(m.army);
    for (const b of s.buildings) p += b.level * (b.type === 'castle' ? 600 : CH.BUILDINGS[b.type].atk ? 120 : 30);
    for (const h in s.heroes) if (s.heroes[h].unlocked) p += 300 * s.heroes[h].level;
    for (const t in s.research.techs) p += 150 * s.research.techs[t];
    return Math.round(p);
  }
  const baseMarchSlots = s => 1 + Math.floor((castleLevel(s) + 1) / 3);
  const marchSlots = s => Math.min(CH.MAX_MARCHES, baseMarchSlots(s) + (s.extraMarch || 0));
  function buyMarchSlot(s) {
    if (marchSlots(s) >= CH.MAX_MARCHES) return { ok: false, reason: 'You already have the maximum of ' + CH.MAX_MARCHES + ' marches' };
    const p = CH.GEM_SHOP.marchSlot(s.extraMarch || 0);
    if (s.res.gems < p) return { ok: false, reason: 'Not enough gems (' + p + ' needed)' };
    s.res.gems -= p; s.extraMarch = (s.extraMarch || 0) + 1;
    return { ok: true, price: p };
  }
  const ownsSkin = (s, kind, id, hero) => id === 'classic' || (kind === 'castle' ? s.skins.castle.includes(id) : (s.skins.hero[hero] || []).includes(id));
  function buySkin(s, kind, id, hero) {
    const sk = CH.SKINS[id];
    if (!sk || (kind === 'hero' && !CH.HEROES[hero])) return { ok: false, reason: 'Unknown skin' };
    if (ownsSkin(s, kind, id, hero)) return { ok: false, reason: 'Already owned' };
    const p = sk[kind];
    if (s.res.gems < p) return { ok: false, reason: 'Not enough gems (' + p + ' needed)' };
    s.res.gems -= p;
    if (kind === 'castle') s.skins.castle.push(id); else (s.skins.hero[hero] = s.skins.hero[hero] || []).push(id);
    equipSkin(s, kind, id, hero);
    return { ok: true, price: p };
  }
  function equipSkin(s, kind, id, hero) {
    if (!ownsSkin(s, kind, id, hero)) return false;
    if (kind === 'castle') s.equipped.castle = id; else s.equipped.hero[hero] = id;
    return true;
  }
  const heroSkin = (s, id) => (s.equipped && s.equipped.hero[id]) || 'classic';
  function trade(s, from, to, amount) {
    const lvl = highestLevel(s, 'tradingPost');
    if (!lvl) return { ok: false, reason: 'Build a Trading Post' };
    amount = Math.floor(amount);
    if (!(amount > 0) || s.res[from] < amount || from === to) return { ok: false, reason: 'Not enough ' + from };
    const got = Math.floor(amount * B.tradingPost.rate(lvl));

  }
  const armySize = s => Object.values(s.army).reduce((a, n) => a + n, 0);
  const housingUsed = s => armySize(s);

  /* ---------- Research ---------- */
  const labLevel = s => highestLevel(s, 'lab');
  function researchCost(kind, id, L) { return kind === 'troop' ? CH.RESEARCH.troopCost(id, L) : kind === 'tech' ? CH.RESEARCH.techCost(L) : CH.RESEARCH.spellCost(L); }
  const resLevel = (s, kind, id) => (kind === 'troop' ? s.research.troops[id] : kind === 'tech' ? s.research.techs[id] || 0 : s.research.spells[id]);
  function researchBlocker(s, kind, id) {
    if (!labLevel(s)) return 'Build a laboratory first';
    if (s.rjob) return 'The lab is busy';
    const cur = resLevel(s, kind, id);
    if (kind === 'tech') { if (cur >= CH.TECHS[id].max) return 'Maximum level'; if (cur >= labLevel(s)) return 'Upgrade the academy first'; }
    else if (cur >= CH.RESEARCH.maxLevel(labLevel(s))) return cur >= 6 ? 'Maximum level' : 'Upgrade the academy first';
    if (kind === 'troop' && highestLevel(s, CH.TROOPS[id].building) < CH.TROOPS[id].unlock) return 'Unlock this troop first';
    if (kind === 'spell' && CH.SPELLS[id].unlock > labLevel(s)) return 'Needs lab level ' + CH.SPELLS[id].unlock;
    if (!canAfford(s, researchCost(kind, id, cur + 1))) return 'Not enough resources';
    return null;
  }
  function research(s, kind, id, now = Date.now()) {
    const why = researchBlocker(s, kind, id);
    if (why) return { ok: false, reason: why };
    const L = resLevel(s, kind, id) + 1;
    pay(s, researchCost(kind, id, L));
    const tm = kind === 'tech' ? CH.RESEARCH.techTime(L) : CH.RESEARCH.time(L);

  }
  const spellUnlocked = (s, id) => labLevel(s) >= CH.SPELLS[id].unlock || (id === 'fireball');

  /* ---------- Heroes ---------- */
  const heroHallLevel = s => highestLevel(s, 'heroHall');
  const heroMaxLevel = s => heroHallLevel(s) * 2;
  function heroBlocker(s, id) {
    const h = s.heroes[id], d = CH.HEROES[id];
    if (!h.unlocked) {
      if (heroHallLevel(s) < d.unlock) return 'Needs Hero Hall level ' + d.unlock;
      if (!canAfford(s, d.cost)) return 'Not enough resources';
      return null;
    }
    if (h.level >= heroMaxLevel(s)) return h.level >= 10 ? 'Maximum level' : 'Upgrade the Hero Hall first';
    if (!canAfford(s, CH.heroUpgradeCost(h.level + 1))) return 'Not enough resources';
    return null;
  }
  function heroAction(s, id) {
    const why = heroBlocker(s, id);
    if (why) return { ok: false, reason: why };
    const h = s.heroes[id];
    if (!h.unlocked) { pay(s, CH.HEROES[id].cost); h.unlocked = true; addXp(s, 40); return { ok: true, unlocked: true }; }
    pay(s, CH.heroUpgradeCost(h.level + 1));
    h.level++; addXp(s, 15 * h.level);
    return { ok: true };
  }
  const heroMult = L => 1 + 0.1 * (L - 1);

  /* ---------- Time ---------- */
  /** Advances every timer to `now`. Returns a list of finished events for toasts. */
  function tick(s, now = Date.now()) {
    const events = [];
    const dt = U.clamp((now - (s.lastSeen || now)) / 1000, 0, 7 * 24 * 3600);
    s.lastSeen = now;
    const cleared = [], pm = prodMult(s);
    // Food upkeep. If food runs out, 1% of the army deserts per 10 starving minutes (capped at 25%).
    const need = upkeepPerHour(s) / 3600 * dt;
    if (need > 0) {
      if (s.res.food >= need) s.res.food -= need;
      else {
        const starveSec = (need - s.res.food) / (need / dt);
        s.res.food = 0;
        const frac = Math.min(0.25, 0.01 * starveSec / 600);
        let lost = 0;
        for (const t in s.army) { const k = Math.floor(s.army[t] * frac); s.army[t] -= k; lost += k; }
        if (lost) { s.stats.deserted += lost; events.push({ kind: 'starving', lost }); }
      }
    }
    for (const b of s.buildings) {
      const d = B[b.type];
      if (d.cat === 'econ' && b.level > 0) b.buf = Math.min(d.buf(b.level), (b.buf || 0) + d.prod(b.level) * pm / 60 * dt);
      if (b.job && b.job.ends <= now) {
        if (b.job.kind === 'clear') {
          const cl = CH.OBSTACLE_CLEAR[b.type];
          const got = give(s, cl.yield);
          const gems = (b.id * 7919) % 3 === 0 ? 2 + (b.id % 3) : 0;

    }
    for (const b of cleared) s.buildings.splice(s.buildings.indexOf(b), 1);
    for (const bld in s.trainJobs) {
      const j = s.trainJobs[bld];
      if (j.ends <= now) { s.army[j.type] = (s.army[j.type] || 0) + j.n; delete s.trainJobs[bld]; addXp(s, Math.ceil(j.n / 20)); events.push({ kind: 'trained', type: j.type, n: j.n }); }
    }
    if (s.healJob && s.healJob.ends <= now) {

    }

      if (j.kind === 'troop') s.research.troops[j.id] = j.to; else if (j.kind === 'tech') s.research.techs[j.id] = j.to; else s.research.spells[j.id] = j.to;
      addXp(s, 20 * j.to);

    }

  }

  /* ---------- Guidance: what to do next ---------- */
  function goals(s) {
    const out = [];
    const cl = castleLevel(s);
    const has = t => s.buildings.some(b => b.type === t && b.level > 0);
    const canBuildMore = t => countOf(s, t) < maxCount(s, t);
    if (!has('stoneQuarry') && canBuildMore('stoneQuarry')) out.push({ text: 'Build a Stone Quarry', act: 'build', type: 'stoneQuarry' });
    if (countOf(s, 'builderHut') < 2) out.push({ text: 'Build a second Builder Hut to work twice as fast', act: 'build', type: 'builderHut' });
    if (!s.campaign['0-0']) out.push({ text: 'Win your first Campaign battle', act: 'campaign' });
    if (!has('goldStorage') && canBuildMore('goldStorage')) out.push({ text: 'Build a Gold Vault to store more gold', act: 'build', type: 'goldStorage' });
    if (cl >= 2 && !has('lab') && canBuildMore('lab')) out.push({ text: 'Build an Academy for research', act: 'build', type: 'lab' });
    if (!s.reports.some(r => r.kind === 'scout')) out.push({ text: 'Open the World map and scout a nearby kingdom', act: 'world' });
    if (!s.stats.attacksWon) out.push({ text: 'Raid a weak kingdom for loot', act: 'world' });
    if (!s.stats.monstersSlain) out.push({ text: 'Clear a monster camp on the World map', act: 'world' });
    if (!Object.keys(s.trainJobs).length && armySize(s) < 400 * cl) out.push({ text: 'Train more troops for your army', act: 'army' });
    if (!highestLevel(s, 'farm') || productionPerMin(s, 'food') * 60 < upkeepPerHour(s)) out.push({ text: 'Build or upgrade Farms: your army eats more than you grow', act: 'build', type: 'farm' });
    if (cl >= 2 && !highestLevel(s, 'watchtower')) out.push({ text: 'Build a Watchtower to spot incoming attacks', act: 'build', type: 'watchtower' });
    if (cl >= 2 && !highestLevel(s, 'embassy')) out.push({ text: 'Build an Embassy and join a faction', act: 'build', type: 'embassy' });
    for (const t of CH.BUILD_MENU[2].types) if (B[t].unlock <= cl && canBuildMore(t)) { out.push({ text: 'Build a ' + B[t].name, act: 'build', type: t }); break; }
    if (countOf(s, 'wall') < maxCount(s, 'wall')) out.push({ text: 'Place walls around your castle (' + countOf(s, 'wall') + '/' + maxCount(s, 'wall') + ')', act: 'build', type: 'wall' });
    if (cl < C.MAX_CASTLE) out.push({ text: 'Upgrade the Castle to level ' + (cl + 1) + ' to unlock ' + unlocksAt(cl + 1).slice(0, 3).join(', '), act: 'castle' });

  }
  /** Human-readable list of things a castle level unlocks. */

      const d = B[t];
      if (d.cat === 'obstacle' || d.cat === 'objective') continue;

      else if (d.unlock < L && d.counts[L - 1] > d.counts[L - 2]) out.push('+' + (d.counts[L - 1] - d.counts[L - 2]) + ' ' + d.name + (d.counts[L - 1] - d.counts[L - 2] > 1 ? 's' : ''));
    }
    for (const r of CH.REGIONS) if (r.castle === L && L > 1) out.unshift('Region: ' + r.name);
    if ((L + 1) % 3 === 0) out.push('One more march slot');
    out.push('Larger kingdom area');
    return out;
  }

  /* ---------- Redeem codes ---------- */
  /** Redeems a code once per save. Rewards may exceed storage (they are a gift). */
  function redeem(s, input, now = Date.now()) {
    const code = String(input || '').trim();
    if (!code) return { ok: false, reason: 'Enter a code' };
    const h = CH.hashCode(code);
    const entry = (CH.REDEEM_CODES || []).find(c => c.hash === h);
    if (!entry) return { ok: false, reason: 'That code isn\'t valid' };
    if (s.redeemed.includes(h)) return { ok: false, reason: 'You already redeemed this code' };
    const day = new Date(now).toISOString().slice(0, 10);
    if (entry.start && day < entry.start) return { ok: false, reason: 'This code isn\'t active yet' };
    if (entry.expires && day > entry.expires) return { ok: false, reason: 'This code has expired' };
    if (entry.minCastle && castleLevel(s) < entry.minCastle) return { ok: false, reason: 'Needs castle level ' + entry.minCastle };
    const rw = entry.reward || {};
    for (const r of [...RES, 'gems', 'runes']) if (rw[r]) s.res[r] += Math.max(0, Math.floor(rw[r]));
    if (rw.troops) for (const t in rw.troops) if (CH.TROOPS[t]) s.army[t] = (s.army[t] || 0) + Math.max(0, Math.floor(rw.troops[t]));
    if (rw.items) for (const i in rw.items) if (CH.ITEMS[i]) s.items[i] = (s.items[i] || 0) + Math.max(0, Math.floor(rw.items[i]));
    if (rw.heroes) for (const h of rw.heroes) if (s.heroes[h]) s.heroes[h].unlocked = true;
    if (rw.skins) for (const k of rw.skins) { const [kind, id, hero] = String(k).split(':'); if (CH.SKINS[id] && !ownsSkin(s, kind, id, hero)) { if (kind === 'castle') s.skins.castle.push(id); else if (CH.HEROES[hero]) (s.skins.hero[hero] = s.skins.hero[hero] || []).push(id); } }
    const levels = rw.xp ? addXp(s, rw.xp) : [];
    s.redeemed.push(h);
    return { ok: true, entry, levels };
  }

  /* ---------- Save / load ---------- */
  function validate(raw) {
    const d = defaults();
    if (!raw || typeof raw !== 'object' || raw.version !== 1) return d;
    const num = (v, lo, hi, df) => (typeof v === 'number' && isFinite(v) ? U.clamp(v, lo, hi) : df);
    for (const r of [...RES, 'gems', 'runes']) d.res[r] = Math.floor(num(raw.res && raw.res[r], 0, 1e9, d.res[r]));
    // Buildings: keep valid ones that don't overlap; always keep a castle.
    if (Array.isArray(raw.buildings)) {
      const out = [];
      const occ = new Set();
      const sorted = raw.buildings.slice().sort((a, b) => (a && a.type === 'castle' ? -1 : 0) - (b && b.type === 'castle' ? -1 : 0));
      for (const b of sorted) {
        if (!b || !B[b.type] || B[b.type].cat === 'objective') continue;
        const size = B[b.type].size;
        const tx = num(b.tx, 0, C.COLS - size, -1), ty = num(b.ty, 0, C.ROWS - size, -1);
        if (tx < 0 || ty < 0) continue;
        const tiles = [];
        let clash = false;
        for (let y = ty; y < ty + size; y++) for (let x = tx; x < tx + size; x++) { const k = y * 100 + x; if (occ.has(k)) clash = true; tiles.push(k); }
        if (clash) continue;
        tiles.forEach(k => occ.add(k));

  <script>/* js/core/audio.js */
/* =====================================================================
 * Crownhold — core/audio.js
 * Every sound is synthesised with the Web Audio API: no audio files to
 * download or license. Music is a small generative modal sequencer.
 * The AudioContext is created on the first user gesture (browser rule).
 * To swap in recorded audio later, replace the bodies of SFX entries.
 * ===================================================================== */

  let ctx = null, master, sfxGain, musicGain, noiseBuf = null;
  let settings = { music: 0.45, sfx: 0.7, muted: false };
  const last = {};
  const music = { timer: null, theme: null, step: 0, next: 0, pending: null };

  function ensure() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return true; }

    if (!AC) return false;
    try { ctx = new AC(); } catch (e) { return false; }
    master = ctx.createGain(); master.connect(ctx.destination);
    sfxGain = ctx.createGain(); sfxGain.connect(master);
    musicGain = ctx.createGain(); musicGain.connect(master);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    apply();
    if (music.pending) { const p = music.pending; music.pending = null; startMusic(p); }

  }

    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    bow() { noise(0.07, 2600, 0.14, 'bandpass'); tone(520, 0.06, 'triangle', 0.04, 260); },
    magic() { tone(700, 0.16, 'sine', 0.07, 1400); tone(1050, 0.12, 'triangle', 0.03, 1800, 0.02); },
    zap() { noise(0.1, 4500, 0.09, 'highpass'); tone(1800, 0.06, 'square', 0.02, 900); },
    nova() { tone(300, 0.4, 'sine', 0.12, 900); noise(0.3, 1800, 0.1, 'bandpass'); },
    cannon() { noise(0.18, 500, 0.22); tone(140, 0.15, 'sine', 0.18, 60); },
    boom() { noise(0.4, 700, 0.28); tone(90, 0.3, 'sine', 0.24, 35); },
    curse() { tone(240, 0.22, 'sawtooth', 0.035, 120); tone(180, 0.25, 'sine', 0.05, 90); },
    bone() { tone(320, 0.07, 'square', 0.03, 180); },
    summon() { tone(150, 0.35, 'sawtooth', 0.05, 330); noise(0.25, 900, 0.07, 'bandpass'); },

    leak() { tone(220, 0.3, 'sawtooth', 0.1, 90); noise(0.2, 300, 0.12); },
    place() { noise(0.12, 320, 0.22); tone(150, 0.14, 'sine', 0.18, 80); },
    upgrade() { [523, 659, 784].forEach((f, i) => tone(f, 0.16, 'triangle', 0.09, null, i * 0.07)); },
    sell() { tone(880, 0.07, 'triangle', 0.09); tone(660, 0.12, 'triangle', 0.09, null, 0.06); },
    coin() { tone(1250, 0.05, 'square', 0.03); tone(1650, 0.08, 'square', 0.03, null, 0.05); },

    bossDeath() { noise(1.3, 500, 0.35); tone(95, 1.1, 'sine', 0.3, 30); [392, 494, 587, 784].forEach((f, i) => tone(f, 0.4, 'triangle', 0.08, null, 0.5 + i * 0.12)); },
    smite() { noise(0.6, 3200, 0.22, 'highpass'); tone(1400, 0.45, 'sine', 0.1, 220); tone(110, 0.5, 'sine', 0.2, 50); },
    fire() { noise(0.7, 900, 0.22, 'bandpass'); tone(160, 0.6, 'sawtooth', 0.05, 80); },
    stun() { tone(520, 0.28, 'sine', 0.06, 160); noise(0.2, 2000, 0.06, 'highpass'); },
    sword() { noise(0.06, 3200, 0.08, 'highpass'); tone(900, 0.05, 'triangle', 0.03, 500); },

    heroDeploy() { [392, 523, 659].forEach((f, i) => tone(f, 0.25, 'triangle', 0.1, null, i * 0.06)); },
    heroDown() { tone(300, 0.6, 'sawtooth', 0.08, 90); },
    roar() { noise(0.9, 260, 0.25); tone(85, 0.9, 'sawtooth', 0.14, 50); tone(130, 0.7, 'square', 0.04, 70, 0.05); },

    wallBreak() { noise(0.22, 900, 0.16, 'bandpass'); },
    spike() { noise(0.08, 4000, 0.12, 'highpass'); tone(700, 0.08, 'square', 0.04, 300); },

    collect() { tone(1050, 0.06, 'square', 0.04); tone(1400, 0.08, 'square', 0.04, null, 0.05); tone(1750, 0.08, 'triangle', 0.04, null, 0.1); },

    victory() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.5, 'triangle', 0.12, null, i * 0.13)); },
    defeat() { [392, 349, 311, 262].forEach((f, i) => tone(f, 0.55, 'sawtooth', 0.06, null, i * 0.24)); },
    error() { tone(160, 0.12, 'square', 0.05); },
    unlock() { [392, 523, 659, 784, 1047].forEach((f, i) => tone(f, 0.3, 'triangle', 0.1, null, i * 0.08)); },

  function play(name) {
    if (!ctx || settings.muted || settings.sfx <= 0) return;
    const now = ctx.currentTime;
    if (last[name] && now - last[name] < (GAP[name] || 0.03)) return;

  }

  const DORIAN = [0, 2, 3, 5, 7, 9, 10];

/* =====================================================================
 * Crownhold — game/battle.js
 * One deterministic engine for all three combat modes:
 *   raid     : the player's troops (side 'atk') attack an AI kingdom
 *   defense  : AI waves (side 'atk') attack the player's real base
 *   campaign : AI waves walk fixed roads; the player builds towers
 * Buildings always belong to side 'def'. No DOM access here.
 *
 * Ground attackers use A* over the tile grid. Walls cost extra to path
 * through, other buildings cost a lot more; when a unit's path runs into
 * a structure it stops and smashes it. Flyers ignore walls entirely.
 *
 * Events via battle.onEvent(type, data): sfx · toast · boss · end · wave ·
 * waveClear · boon · star
 * ===================================================================== */
(function () {
  const C = CH.CONFIG, B = CH.BUILDINGS, U = CH.util, T = C.T, W = C.COLS, H = C.ROWS;
  const tc = i => ((i % W) + 0.5) * T, tr = i => (Math.floor(i / W) + 0.5) * T;

  /* ---------- Tiny binary heap for A* ---------- */
  class Heap {
    constructor() { this.k = []; this.v = []; }

      '<div class="b-boss hidden" id="b-boss"><span id="b-boss-name"></span><div class="bar"><i id="b-boss-bar"></i></div></div>' +
      '<div class="b-banner" id="b-banner"></div>' +
      '<div class="b-tower hidden" id="b-tower"></div>' +
      '<nav class="b-bar" id="b-bar"></nav>';
    $('b-quit').onclick = quit;
    $('b-speed').onclick = () => { st.speed = st.speed === 1 ? 2 : st.speed === 2 ? 3 : 1; $('b-speed').textContent = st.speed + '×'; };
    $('b-call').onclick = () => { if (st.b.canCallWave && st.b.canCallWave()) st.b.callWave(); };
    $('b-bar').onclick = onBar;
    $('b-tower').onclick = onTowerPanel;
    renderBar(true);
    const intro = b.mode === 'raid' ? 'Raid ' + b.opponent.name : b.mode === 'defense' ? 'Endless Defense' : 'Stage ' + (b.stage.r + 1) + '-' + (b.stage.s + 1) + ': ' + b.stage.name;
    banner(intro, b.mode === 'raid' ? 'Deploy outside the red zone · drag to deploy a line' : b.mode === 'defense' ? 'Place your heroes, then start the first wave' : CH.OBJECTIVES[b.stage.obj] + (CH.App.view.portrait ? ' Drag to look around.' : ''));
  }
  function close() { st.b = null; $('bhud').classList.add('hidden'); $('bhud').innerHTML = ''; }

  let bannerT;
  function banner(t, sub, cls) {
    const el = $('b-banner'); if (!el) return;
    el.className = 'b-banner'; el.innerHTML = '<b>' + UI.esc(t) + '</b>' + (sub ? '<span>' + UI.esc(sub) + '</span>' : '');
    void el.offsetWidth; el.className = 'b-banner show ' + (cls || '');
    clearTimeout(bannerT); bannerT = setTimeout(() => el.classList.remove('show'), 2400);
  }

  /* ---------- Deploy bar ---------- */
  function renderBar(force) {
    const b = st.b; if (!b) return;
    const key = JSON.stringify([b.army, b.spells, Object.keys(b.heroesUsed).map(h => [h, b.heroesUsed[h].dead, Math.ceil(b.heroesUsed[h].abilityCd)]), st.sel, b.mode === 'campaign' ? Math.floor(b.gold / 10) : 0]);
    if (!force && key === st.key) return;
    st.key = key;
    const items = [];
    const isSel = (k, id) => st.sel && st.sel.kind === k && st.sel.id === id ? ' sel' : '';
    if (b.mode === 'campaign') for (const t of b.towerTypes) {
      const price = CH.TOWER_PRICE[t];
      items.push('<button class="b-card tower' + isSel('tower', t) + (b.gold < price ? ' poor' : '') + '" data-k="tower" data-id="' + t + '"><canvas data-building="' + t + '" data-level="' + b.towerBase[t] + '"></canvas><span class="n">' + CH.BUILDINGS[t].name.split(' ')[0] + '</span><span class="c">' + UI.icon('gold') + price + '</span></button>');
    }
    for (const t of CH.TROOP_ORDER) if ((b.army[t] || 0) > 0 || b.used[t]) {
      const d = CH.TROOPS[t];
      items.push('<button class="b-card' + isSel('troop', t) + (b.army[t] ? '' : ' empty') + '" data-k="troop" data-id="' + t + '"><canvas data-unit="' + d.sprite + '" data-size="' + d.size + '"></canvas><span class="n">' + d.name + '</span><span class="c">×' + (b.army[t] || 0) + '</span></button>');
    }
    for (const h of b.heroesAvail) {
      const d = CH.HEROES[h], u = b.heroesUsed[h];
      let state = 'Deploy';
      if (u) state = u.dead ? 'Fallen' : u.abilityCd > 0 ? Math.ceil(u.abilityCd) + 's' : d.ability.name;
      items.push('<button class="b-card hero' + isSel('hero', h) + (u && u.dead ? ' empty' : '') + (u && !u.dead && u.abilityCd <= 0 ? ' ready' : '') + '" data-k="hero" data-id="' + h + '"><canvas data-unit="' + d.sprite + '" data-size="' + d.size + '"></canvas><span class="n">' + d.name.split(' ').pop() + '</span><span class="c">' + state + '</span>' + (u && !u.dead && u.abilityCd > 0 ? '<i class="cd" style="--cd:' + (u.abilityCd / d.ability.cd).toFixed(2) + '"></i>' : '') + '</button>');
    }
    for (const sp of CH.SPELL_ORDER) if (CH.State.spellUnlocked(b.save, sp)) {
      items.push('<button class="b-card spell' + isSel('spell', sp) + (b.spells[sp] ? '' : ' empty') + '" data-k="spell" data-id="' + sp + '">' + UI.icon(sp, 'sp') + '<span class="n">' + CH.SPELLS[sp].name.split(' ').pop() + '</span><span class="c">×' + b.spells[sp] + '</span></button>');
    }
    if (!items.length) items.push('<p class="b-empty">No troops, heroes or spells. Train an army at home.</p>');
    $('b-bar').innerHTML = items.join('');
    UI.paintCanvases($('b-bar'));
    positionCall();
  }
  /** Keep the wave / end-battle button just above the deploy bar when they would overlap. */
  function positionCall() {
    const call = $('b-call'), bar = $('b-bar');
    if (!call || !bar) return;
    call.style.bottom = '';
    const c = call.getBoundingClientRect(), r = bar.getBoundingClientRect();
    const overlapX = c.left < r.right && c.right > r.left, overlapY = c.bottom > r.top - 6;
    if (overlapX && overlapY) call.style.bottom = Math.round(window.innerHeight - r.top + 8) + 'px';
  }
  window.addEventListener('resize', () => setTimeout(positionCall, 50));

  function onBar(e) {
    const c = e.target.closest('.b-card'); if (!c || !st.b) return;
    const k = c.dataset.k, id = c.dataset.id, b = st.b;
    CH.Audio.play('click');
    if (k === 'hero' && b.heroesUsed[id]) { if (!b.useAbility(id)) UI.toast(b.heroesUsed[id].dead ? 'This hero has fallen.' : 'Ability recharging.', 'warn'); renderBar(true); return; }
    st.sel = st.sel && st.sel.kind === k && st.sel.id === id ? null : { kind: k, id };
    hideTowerPanel();
    renderBar(true);
  }

  /* ---------- Campaign tower panel ---------- */
  function showTowerPanel(bd) {
    st.selB = bd;
    const b = st.b, c = b.towerUpgradeCost(bd);
    $('b-tower').innerHTML = '<b>' + CH.BUILDINGS[bd.type].name + ' · level ' + bd.level + '</b><span>' + Math.round(bd.atk.dmg) + ' damage · range ' + (bd.atk.range / T).toFixed(1) + '</span>' +
      '<div class="row">' + (c === null ? '<button class="btn" disabled>Max</button>' : '<button class="btn btn-gold" data-t="up"' + (b.gold >= c ? '' : ' disabled') + '>Upgrade ' + UI.icon('gold') + c + '</button>') +
      '<button class="btn btn-danger-quiet" data-t="sell">Sell +' + Math.floor(bd.spent * 0.6) + '</button><button class="icon-btn" data-t="x">' + UI.icon('close') + '</button></div>';
    $('b-tower').classList.remove('hidden');
  }
  function hideTowerPanel() { st.selB = null; const el = $('b-tower'); if (el) el.classList.add('hidden'); }
  function onTowerPanel(e) {
    const a = e.target.closest('[data-t]'); if (!a || a.disabled || !st.selB) return;
    if (a.dataset.t === 'up') { st.b.upgradeTower(st.selB); showTowerPanel(st.selB); }
    else if (a.dataset.t === 'sell') { st.b.sellTower(st.selB); hideTowerPanel(); }
    else hideTowerPanel();
  }

  /* ---------- World input ---------- */
  function act(p, fromDrag) {
    const b = st.b; if (!b || b.result) return false;
    const s = st.sel;
    if (!s) {
      if (b.mode === 'campaign' && !fromDrag) {
        const tx = Math.floor(p.x / T), ty = Math.floor(p.y / T), k = b.occ[ty * CH.CONFIG.COLS + tx];
        const bd = k ? b.buildings[k - 1] : null;
        if (bd && bd.placed && !bd.dead) { showTowerPanel(bd); return true; }
        hideTowerPanel();
      }
      return false;
    }
    let r;
    if (s.kind === 'tower') {
      const tx = Math.round(p.x / T - 1), ty = Math.round(p.y / T - 1);
      const k = b.occ[Math.floor(p.y / T) * CH.CONFIG.COLS + Math.floor(p.x / T)];
      if (!fromDrag && k && b.buildings[k - 1].placed) { showTowerPanel(b.buildings[k - 1]); return true; }
      r = b.placeTower(s.id, tx, ty);
      if (!r.ok && !fromDrag) { UI.toast(r.reason || 'Can\'t build there', 'warn'); CH.Audio.play('error'); }
      return r.ok;
    }
    if (s.kind === 'troop') { r = b.deployTroop(s.id, p.x, p.y); if (!r.ok && !fromDrag) { UI.toast(r.reason, 'warn'); CH.Audio.play('error'); } if (!b.army[s.id]) st.sel = null; }
    else if (s.kind === 'hero') { r = b.deployHero(s.id, p.x, p.y); if (!r.ok) { UI.toast(r.reason, 'warn'); CH.Audio.play('error'); } else st.sel = null; }
    else if (s.kind === 'spell') { r = { ok: b.castSpell(s.id, p.x, p.y) }; if (!r.ok) UI.toast('No charges left', 'warn'); st.sel = b.spells[s.id] ? s : null; }
    renderBar(true);
    return r && r.ok;
  }
  const handler = {
    tap(p) { act(p, false); },
    hover(p) { st.pointer = p; st.hoverTile = p ? { tx: Math.round(p.x / T - 1), ty: Math.round(p.y / T - 1) } : null; },
    dragStart(p) { if (st.b && st.b.mode === 'raid' && st.sel && st.sel.kind === 'troop') { st.dragLast = p; act(p, true); return true; } return false; },
    dragMove(p) { st.pointer = p; if (st.dragLast && Math.hypot(p.x - st.dragLast.x, p.y - st.dragLast.y) > 14) { st.dragLast = p; act(p, true); } },
    dragEnd() { st.dragLast = null; },
    cancel() { st.sel = null; hideTowerPanel(); renderBar(true); },
  };

  /* ---------- Per-frame HUD ---------- */
  function tick(dt) {
    const b = st.b; if (!b) return;
    if (!st.paused && !b.pendingBoon && !CH.UI.modalOpen()) {
      const steps = Math.round(dt * 60 * st.speed);
      for (let i = 0; i < Math.min(steps, 12) && !b.result; i++) b.update(1 / 60);
    }
    let info = '', call = '', callOn = false;
    if (b.mode === 'raid') {
      const left = Math.max(0, b.timeLimit - b.time);
      const lg = b.lootGot;
      info = '<span class="pill">' + UI.icon('time') + U.time(left) + '</span><span class="pill stars-pill">' + [0, 1, 2].map(i => '<span class="star' + (i < b.stars ? ' on' : '') + '">' + UI.ICONS.star + '</span>').join('') + '</span><span class="pill">' + b.destruction + '% destroyed</span>' +
        '<span class="pill">' + UI.icon('gold') + U.fmt(lg.gold) + ' ' + UI.icon('wood') + U.fmt(lg.wood) + ' ' + UI.icon('stone') + U.fmt(lg.stone) + '</span>';
      call = 'End battle'; callOn = true;
      $('b-call').onclick = () => { if (!b.result) b.retreat(); };
    } else if (b.mode === 'defense') {
      info = '<span class="pill">Wave ' + b.wave + (b.waveMod ? ' · ' + b.waveMod.name : '') + '</span><span class="pill">Best ' + b.save.defense.best + '</span><span class="pill">' + b.stats.kills + ' slain</span>' +
        '<span class="pill">Banked ' + UI.icon('gold') + U.fmt(b.bank.gold) + ' ' + UI.icon('runes') + b.bank.runes + '</span>';
      const busy = b.spawning || b.units.some(u => u.side === 'atk');
      call = b.wave === 0 ? 'Start wave 1' : busy ? 'Wave in progress' : 'Next wave (' + Math.ceil(Math.max(0, b.breakT)) + ')';
      callOn = !busy && !b.pendingBoon;
    } else {
      const core = b.core;
      info = '<span class="pill">Wave ' + Math.max(0, b.waveIdx + 1) + ' / ' + b.nWaves + '</span><span class="pill gold-pill">' + UI.icon('gold') + Math.floor(b.gold) + '</span>' +
        '<span class="pill">Castle <span class="bar mini"><i style="width:' + Math.round(core.hp / core.maxHp * 100) + '%"></i></span></span>' +
        (b.timeLimit ? '<span class="pill">' + UI.icon('time') + U.time(Math.max(0, b.timeLimit - b.time)) + '</span>' : '');
      const busy = b.spawning || b.units.some(u => u.side === 'atk');
      call = b.waveIdx < 0 ? 'Start wave 1' : b.waveIdx >= b.nWaves - 1 ? 'Final wave' : busy ? 'Call next wave' : 'Next wave (' + Math.ceil(Math.max(0, 10 - b.breakT)) + ')';
      callOn = b.canCallWave();
    }
    if (st.info !== info) { st.info = info; $('b-info').innerHTML = info; }
    const btn = $('b-call');
    if (btn.textContent !== call) btn.textContent = call;
    btn.disabled = !callOn;
    btn.classList.toggle('pulse', callOn && (b.mode !== 'raid') && !b.units.some(u => u.side === 'atk'));
    const boss = b.boss && !b.boss.dead ? b.boss : null;
    $('b-boss').classList.toggle('hidden', !boss);
    if (boss) { $('b-boss-name').textContent = boss.def.name + (boss.enraged ? ' (enraged)' : ''); $('b-boss-bar').style.width = Math.max(0, boss.hp / boss.maxHp * 100) + '%'; }
    renderBar(false);
    if (st.selB && b.mode === 'campaign' && st.selB.dead) hideTowerPanel();
  }

  /* ---------- Events ---------- */
  function onEvent(type, d) {
    const b = st.b;
    switch (type) {
      case 'sfx': CH.Audio.play(d); break;
      case 'toast': UI.toast(d.text, d.kind === 'gold' ? 'good' : d.kind === 'danger' ? 'bad' : 'info'); break;
      case 'boss': banner(d.def.name, d.def.desc, 'boss'); CH.Audio.startMusic('boss'); break;
      case 'star': banner('★ ' + d.text, d.stars + (d.stars === 1 ? ' star' : ' stars'), 'star'); break;
      case 'wave': banner('Wave ' + d.n + (d.total ? ' of ' + d.total : ''), d.mod ? d.mod.name + ': ' + d.mod.desc : d.boss ? 'The boss approaches!' : d.mini ? 'A mini-boss leads this wave' : ''); break;
      case 'waveClear': UI.toast('Wave ' + d.n + ' cleared · banked ' + U.fmt(d.rw.gold) + ' gold' + (d.rw.runes ? ', ' + d.rw.runes + ' rune' + (d.rw.runes > 1 ? 's' : '') : ''), 'good'); break;
      case 'boon': boonModal(d); break;
      case 'end': setTimeout(() => CH.App.endBattle(b), 1300); break;
    }
  }
  function boonModal(list) {
    UI.modal('<h3>Wave ' + st.b.wave + ' survived!</h3><p>Choose a blessing for your kingdom.</p><div class="boons">' +
      list.map(x => '<button class="boon" data-boon="' + x.id + '"><b>' + x.name + '</b><span>' + x.desc + '</span></button>').join('') + '</div>',
    { noClose: true, onClick: e => { const c = e.target.closest('[data-boon]'); if (c && st.b) { st.b.chooseBoon(c.dataset.boon); UI.closeModal(); } } });
  }
  function quit() {
    const b = st.b; if (!b || b.result) return;
    const msg = b.mode === 'raid' ? 'End the raid now? You keep the loot you have taken.' : b.mode === 'defense' ? 'End the defense now? You keep everything banked so far.' : 'Leave this stage? Troops you deployed are lost.';
    UI.modal('<h3>Leave battle?</h3><p>' + msg + '</p><div class="row"><button class="btn btn-gold" data-q>Leave</button><button class="btn" data-close>Keep fighting</button></div>',
      { onClick: e => { if (e.target.closest('[data-q]')) { UI.closeModal(); if (b.mode === 'raid') b.retreat(); else b.finish(b.mode === 'defense' ? 'lose' : 'lose', 'You left the battle.'); } } });
  }

  function drawUi() { return { deployMode: st.sel && (st.sel.kind === 'troop' || st.sel.kind === 'hero'), placeTower: st.sel && st.sel.kind === 'tower' ? st.sel.id : null, hoverTile: st.hoverTile, spellAim: st.sel && st.sel.kind === 'spell' ? st.sel.id : null, pointer: st.pointer, selectedB: st.selB }; }

  return { open, close, tick, handler, onEvent, drawUi, state: st };
})();

</script>
  <script>/* js/ui/world.js */
/* =====================================================================
 * Eldoria — ui/world.js
 * World map screen, target panels, march dialog, marches drawer,
 * battle/scout reports, incoming-attack warnings, teleport, battle
 * replays and the "while you were away" summary.
 * ===================================================================== */
CH.WorldUI = (function () {
  const UI = CH.UI, S = CH.State, U = CH.util, $ = UI.$, TW = CH.WorldView.TW;
  const st = { sel: null, filters: { kin: true, mon: true, res: true, diff: 'all' }, teleport: null, drawer: false };
  const save = () => CH.App.save, W = () => CH.App.save.world;
  const icon = UI.icon, esc = UI.esc;
  const troopIcon = (t, n) => '<span class="tchip"><canvas data-unit="' + (CH.TROOPS[t] ? CH.TROOPS[t].sprite : (CH.ENEMIES[t] || {}).sprite || 'swordsman') + '" data-size="10"></canvas><b>' + U.fmt(n) + '</b></span>';
  const armyList = a => Object.keys(a || {}).filter(t => a[t] > 0).map(t => troopIcon(t, a[t])).join('') || '<span class="muted">none</span>';
  const fail = r => { UI.toast(r.reason || 'Not possible', 'warn'); CH.Audio.play('error'); };

  /* ---------------- Screen ---------------- */
  function open(focus) {
    const app = CH.App;
    app.mode = 'world';
    document.body.classList.add('in-world');
    $('wmap').classList.remove('hidden');
    app.wview.resize();
    const w = W();
    if (focus) app.wview.center(focus.x, focus.y); else if (!st.opened) app.wview.center(w.px, w.py);
    st.opened = true;
    app.wview.handler = { tap: onTap };
    render(); CH.Audio.startMusic('battle', 50);
  }
  function close() {
    document.body.classList.remove('in-world');
    $('wmap').classList.add('hidden'); hidePanel(); st.teleport = null;
    CH.App.goHome(false);
  }
  function render() {
    const s = save();
    $('whud').innerHTML =
      '<button class="icon-btn" data-w="home" title="Back to your kingdom">' + icon('back') + '</button>' +
      '<div class="w-coords" id="w-coords"></div>' +
      '<div class="w-btns"><button class="chip-btn" data-w="filters">' + icon('map') + 'Filter</button><button class="chip-btn" data-w="search">' + icon('crown') + 'Go to</button>' +
      '<button class="chip-btn" data-w="mine">' + icon('shield') + 'My castle</button>' +
      '<button class="chip-btn" data-w="mail">✉ <b id="w-unread">' + (s.unread || '') + '</b></button></div>';
    $('whud').onclick = onHud;
    $('wbar').onclick = onBar;
    renderBar(true);
  }
  function onHud(e) {
    const b = e.target.closest('[data-w]'); if (!b) return;
    CH.Audio.play('click');
    const k = b.dataset.w;
    if (k === 'home') close();
    else if (k === 'mine') { CH.App.wview.center(W().px, W().py); selectAt(W().px, W().py); }
    else if (k === 'mail') UI.sheet('mail');
    else if (k === 'filters') filterModal();
    else if (k === 'search') searchModal();
  }
  function filterModal() {
    const f = st.filters;
    UI.modal('<h3>Map filters</h3><div class="row">' + [['kin', 'Kingdoms'], ['mon', 'Monsters'], ['res', 'Resources']].map(([k, n]) => '<button class="tab' + (f[k] ? ' on' : '') + '" data-f="' + k + '">' + n + '</button>').join('') + '</div>' +
      '<h4 class="group">Kingdom strength (vs you)</h4><div class="row">' + [['all', 'All'], ['weak', 'Weaker'], ['even', 'Similar'], ['strong', 'Stronger']].map(([k, n]) => '<button class="tab' + (f.diff === k ? ' on' : '') + '" data-d="' + k + '">' + n + '</button>').join('') + '</div>',
    { onClick: e => { const a = e.target.closest('[data-f]'), d = e.target.closest('[data-d]'); if (a) f[a.dataset.f] = !f[a.dataset.f]; if (d) f.diff = d.dataset.d; if (a || d) { UI.closeModal(); filterModal(); } } });
  }
  function searchModal() {
    const w = W();
    const near = w.kingdoms.map(k => ({ k, d: CH.World.dist(k, { x: w.px, y: w.py }) })).sort((a, b) => a.d - b.d).slice(0, 8);
    UI.modal('<h3>Go to</h3><div class="row"><input id="gx" type="number" inputmode="numeric" placeholder="X" min="0" max="95"><input id="gy" type="number" inputmode="numeric" placeholder="Y" min="0" max="95"><button class="btn btn-gold" data-go>Go</button></div>' +
      '<h4 class="group">Nearby kingdoms</h4><div class="b-list">' + near.map(n => '<button class="b-row" data-k="' + n.k.id + '"><div class="b-info"><b>' + esc(n.k.name) + '</b><span class="muted">Castle ' + n.k.cl + ' · power ' + U.fmt(CH.World.power(n.k)) + ' · ' + n.d.toFixed(0) + ' tiles</span></div></button>').join('') + '</div>',
    { onClick: e => {
      if (e.target.closest('[data-go]')) { const x = +$('gx').value, y = +$('gy').value; if (x >= 0 && y >= 0 && x < 96 && y < 96) { UI.closeModal(); CH.App.wview.center(x, y); selectAt(x, y); } }
      const k = e.target.closest('[data-k]'); if (k) { const kk = W().kingdoms.find(z => z.id === k.dataset.k); UI.closeModal(); CH.App.wview.center(kk.x, kk.y); select({ type: 'kingdom', o: kk }); }
    } });
  }

  /* ---------------- Selection ---------------- */
  function findAt(x, y) {
    const w = W(), d = o => Math.hypot(o.x + 0.5 - x, o.y + 0.5 - y);
    let best = null, bd = 1.1;
    const consider = (type, o) => { const dd = d(o); if (dd < bd) { bd = dd; best = { type, o }; } };
    consider('home', { x: w.px, y: w.py });
    if (w.throne && Math.hypot(w.throne.x + 0.5 - x, w.throne.y + 0.5 - y) < 2.6) { best = { type: 'throne', o: w.throne }; bd = 0.5; }
    for (const k of w.kingdoms) consider('kingdom', k);
    if (st.filters.mon) { for (const c of w.camps) if (!c.dead) consider('camp', c); for (const r of w.ruins) if (!r.dead) consider('ruin', r); if (w.dragon) consider('dragon', w.dragon); }
    if (st.filters.res) for (const t of w.tiles) consider('tile', t);
    for (const f of w.forts) consider('fort', f);
    for (const m of w.marches) { const p = marchPos(m); if (Math.hypot(p.x + 0.5 - x, p.y + 0.5 - y) < 0.8 && (m.owner === 'player' || m.target.type === 'player')) { best = { type: 'march', o: m }; bd = 0; } }
    return best;
  }
  function marchPos(m) { const p = m.kind === 'gathering' ? 1 : U.clamp((Date.now() - m.t0) / (m.t1 - m.t0), 0, 1); return { x: m.fx + (m.tx - m.fx) * p, y: m.fy + (m.ty - m.fy) * p }; }
  function onTap(x, y) {
    if (st.teleport) { const tx = Math.floor(x), ty = Math.floor(y); st.teleport = { x: tx, y: ty }; teleportPanel(); return; }
    const hit = findAt(x, y);
    if (hit) select(hit); else { CH.Audio.play('click'); select({ type: 'empty', o: { x: Math.floor(x), y: Math.floor(y) } }); }
  }
  function selectAt(x, y) { const h = findAt(x + 0.5, y + 0.5); if (h) select(h); }
  function select(hit) { st.sel = hit; CH.Audio.play('click'); panel(); }
  function hidePanel() { st.sel = null; $('wpanel').classList.add('hidden'); }

  function panel() {
    const s = save(), w = W(), h = st.sel, now = Date.now();
    if (!h) return hidePanel();
    const o = h.o, dist = CH.World.dist(o, { x: w.px, y: w.py });
    let head = '', body = '', acts = '';
    const coords = '<span class="kicker">(' + Math.round(o.x) + ', ' + Math.round(o.y) + ') · ' + dist.toFixed(0) + ' tiles away</span>';
    if (h.type === 'kingdom') {
      const scout = s.reports.find(r => r.kind === 'scout' && r.targetId === o.id);
      const P = CH.PERSONALITIES[o.p], fac = CH.FACTIONS[o.f];
      head = '<h3>' + esc(o.name) + '</h3><p class="muted">' + esc(o.ruler) + ' · <span style="color:' + fac.color + '">' + fac.name + '</span></p>';
      const pow = CH.World.power(o), mine = CH.World.playerDefPower(s);
      const rel = pow < mine * 0.8 ? '<span class="good">Weaker than you</span>' : pow > mine * 1.25 ? '<span class="warn">Stronger than you</span>' : 'About your strength';
      body = '<dl class="stats">' +
        '<div><dt>Castle level</dt><dd>' + o.cl + '</dd></div><div><dt>Power (est.)</dt><dd>' + U.fmt(pow) + '</dd></div>' +
        '<div><dt>Threat</dt><dd>' + rel + '</dd></div><div><dt>Temperament</dt><dd>' + (scout ? P.name : 'Scout to learn') + '</dd></div>' +
        '<div><dt>Record</dt><dd>' + o.wins + ' wins · ' + o.losses + ' losses</dd></div>' +
        '<div><dt>Status</dt><dd>' + (o.sh > now ? '🛡 Shield ' + U.time((o.sh - now) / 1000) : o.tcd > now ? 'Recently raided (' + U.time((o.tcd - now) / 1000) + ')' : o.out ? 'Army away' : 'Open') + '</dd></div>' +
        (o.grudge ? '<div><dt>Grudge vs you</dt><dd class="warn">' + '⚔'.repeat(Math.min(5, o.grudge)) + '</dd></div>' : '') +
        '</dl>' + (scout ? '<p class="muted">Last scout ' + U.time((now - scout.t) / 1000) + ' ago: about ' + U.fmt(scout.troopsTotal) + ' troops, loot ≈ ' + U.fmt(Object.values(scout.loot).reduce((a, n) => a + n, 0)) + '.</p>' : '') +
        (o.hist.length ? '<p class="muted">Recent: ' + o.hist.slice(0, 2).map(x => esc(x.text)).join(' · ') + '</p>' : '');
      const same = s.faction != null && s.faction === o.f;
      acts = same ? '<p class="muted">An ally of your faction.</p>' : '<button class="btn" data-p="scout">' + icon('xp') + 'Scout · 100 gold</button><button class="btn btn-gold" data-p="attack">' + icon('swords') + 'Attack</button>' + (scout ? '<button class="btn btn-quiet" data-p="report">Scout report</button>' : '');
    } else if (h.type === 'camp' || h.type === 'ruin' || h.type === 'dragon') {
      const name = h.type === 'dragon' ? 'Elder Dragon' : h.type === 'ruin' ? 'Ancient Ruins' : CH.CAMP_TYPES[o.kind].name;
      const mon = CH.World.campMonsters(o, w, now), rw = CH.World.campRewards(o, w, now);
      head = '<h3>' + name + ' <span class="lv">Level ' + o.lvl + '</span></h3>';
      body = '<p class="muted">Guarded by:</p><div class="tchips">' + armyList(mon) + '</div><p class="muted">Rewards:</p><div class="chips">' + UI.reward({ ...rw.rw, xp: rw.xp }) + Object.keys(rw.items).map(i => '<span class="chip">' + CH.ITEMS[i].name + '</span>').join('') + '</div>' +
        (h.type === 'dragon' ? '<p class="warn">Event boss! Leaves in ' + U.time((o.until - now) / 1000) + '.</p>' : '');
      acts = '<button class="btn" data-p="scout">' + icon('xp') + 'Scout</button><button class="btn btn-gold" data-p="attack">' + icon('swords') + 'Attack</button>';
    } else if (h.type === 'tile') {
      const busy = o.by ? w.marches.find(m => m.id === o.by) : null;
      head = '<h3>' + CH.RES_TILES[o.type] + ' <span class="lv">Level ' + o.lvl + '</span></h3>';
      body = '<dl class="stats"><div><dt>Resource</dt><dd>' + icon(o.type) + U.fmt(o.amt) + '</dd></div><div><dt>Gather speed</dt><dd>' + U.fmt(6 * o.lvl * 3600) + ' / h' + (CH.World.evOn(w, now, 'resourceRush') ? ' ×2' : '') + '</dd></div></dl><p class="muted">Troops gather up to their carrying capacity (load). Cavalry carry the most.</p>';
      acts = busy ? '<p class="muted">' + (busy.owner === 'player' ? 'Your troops are gathering here.' : 'Occupied.') + '</p>' : '<button class="btn btn-gold" data-p="gather">' + icon(o.type) + 'Gather</button>';
    } else if (h.type === 'fort') {
      head = '<h3>' + (o.owner ? esc(o.ownerName) + '\'s fort' : 'Abandoned Fort') + ' <span class="lv">Level ' + o.lvl + '</span></h3>';
      body = '<p>Holding a fort gives <b>+6% production</b> of every resource (doubled during Castle Siege). Expansionist kingdoms will try to take it from you.</p>';
      acts = o.owner === 'player' ? '<p class="good">You hold this fort.</p>' : '<button class="btn btn-gold" data-p="attack">' + icon('swords') + 'Capture</button>';
    } else if (h.type === 'throne') {
      const TH = CH.THRONE, win = CH.Throne.warWindow(now), war = o.war && !o.war.ended && now < o.war.end ? o.war : null;
      head = '<h3>👑 ' + TH.name + '</h3><p class="muted">The Throne of Eldoria</p>';
      const board = war ? Object.entries(war.hold).map(([k, ms]) => [k, ms + (war.holder === k ? now - war.holdStart : 0)]).concat(war.holder !== 'guard' && !war.hold[war.holder] ? [[war.holder, now - war.holdStart]] : []).sort((a, b) => b[1] - a[1]).slice(0, 5) : [];
      body = '<dl class="stats">' +
        '<div><dt>' + TH.title + '</dt><dd>' + (o.king ? esc(o.king.name) + (o.king.key === 'player' ? ' (you!)' : '') : 'None') + '</dd></div>' +
        (o.king ? '<div><dt>Reign ends</dt><dd>' + U.time((o.king.until - now) / 1000) + '</dd></div>' : '') +
        '<div><dt>Throne War</dt><dd>' + (war ? '<span class="warn">LIVE · ' + U.time((war.end - now) / 1000) + ' left</span>' : 'Saturday ' + TH.warHour + ':00 · in ' + U.time((win.next - now) / 1000)) + '</dd></div>' +
        (war ? '<div><dt>Held by</dt><dd>' + esc(CH.Throne.keyName(s, war.holder)) + '</dd></div>' : '') + '</dl>' +
        (war ? '<p class="muted">Longest hold so far:</p><ol class="news">' + (board.map(([k, ms]) => '<li>' + esc(CH.Throne.keyName(s, k)) + ' · ' + U.time(ms / 1000) + '</li>').join('') || '<li>Nobody yet: the Guardians hold it.</li>') + '</ol>' :
          '<p class="muted">Every Saturday at ' + TH.warHour + ':00 the Citadel opens for ' + TH.warMinutes + ' minutes. Whoever holds it longest in total becomes ' + TH.title + ' for a week and hands out the treasure inside. Factions can rally up to ' + TH.rallyMax + ' castles.</p>') +
        '<p class="muted">Treasure: 1 Royal Treasure, 3 Noble Chests, 6 Knight Chests.</p>';
      acts = '<button class="btn" data-p="scout">' + icon('xp') + 'Scout</button>' +
        (war ? (war.holder === 'player' ? '<button class="btn btn-gold" data-p="attack">Reinforce</button>' : '<button class="btn btn-gold" data-p="attack">' + icon('swords') + 'Attack</button>') : '') +
        (CH.Throne.isPlayerKing(s) ? '<button class="btn btn-gold" data-p="court">🎁 Royal Court</button>' : '') + '<button class="btn btn-quiet" data-p="ranks">Leaderboards</button>';
    } else if (h.type === 'home') {
      head = '<h3>★ ' + esc(s.player.name) + '</h3><p class="muted">Your kingdom · power ' + U.fmt(S.power(s)) + '</p>';
      body = '<dl class="stats"><div><dt>Protection</dt><dd>' + (S.beginner(s) ? 'Beginner protection' : s.shieldUntil > now ? '🛡 ' + U.time((s.shieldUntil - now) / 1000) : 'None') + '</dd></div><div><dt>March slots</dt><dd>' + S.marchSlots(s) + '</dd></div></dl>';
      acts = '<button class="btn btn-gold" data-p="enter">Enter kingdom</button><button class="btn" data-p="tele-random">Random teleport (' + (s.items.teleRandom || 0) + ')</button><button class="btn" data-p="tele-pick">Advanced teleport (' + (s.items.teleAdvanced || 0) + ')</button>';
    } else if (h.type === 'march') {
      const m = o, tgt = describeTarget(m);
      head = '<h3>' + (m.owner === 'player' ? 'Your march' : '⚠ Enemy army') + '</h3><p class="muted">' + m.kind + ' → ' + esc(tgt) + '</p>';
      body = '<div class="tchips">' + (m.owner === 'player' || S.highestLevel(s, 'watchtower') >= 5 ? armyList(m.army) : '<span class="muted">Upgrade your Watchtower to see their troops.</span>') + '</div><p>Arrives in ' + U.time((m.t1 - now) / 1000) + '</p>';
      acts = m.owner === 'player' && m.kind !== 'return' ? '<button class="btn" data-p="recall" data-id="' + m.id + '">Recall</button>' : '';
    } else {
      head = '<h3>Open land</h3>';
      body = '<p class="muted">Biome: ' + CH.World.biomeAt(o.x, o.y, w.seed) + '.</p>';
      acts = '<button class="btn" data-p="tele-here">Teleport here</button>';
    }
    $('wpanel').innerHTML = '<button class="x-btn" data-p="close" aria-label="Close">' + icon('close') + '</button>' + coords + head + body + '<div class="panel-actions">' + acts + '</div>';
    $('wpanel').classList.remove('hidden');
    $('wpanel').onclick = onPanel;
    UI.paintCanvases($('wpanel'));
  }
  function describeTarget(m) {
    const w = W();
    if (m.target.type === 'player') return save().player.name;
    if (m.target.type === 'home') return 'home';
    const o = CH.World.findAny(w, m.target.id);
    return o ? (o.name || (o.kind ? CH.CAMP_TYPES[o.kind].name : o.type ? CH.RES_TILES[o.type] : o.isDragon ? 'Elder Dragon' : o.lvl ? 'Fort / ruins' : '?')) : '?';
  }
  function onPanel(e) {
    const b = e.target.closest('[data-p]'); if (!b) return;
    const h = st.sel, s = save();
    CH.Audio.play('click');
    switch (b.dataset.p) {
      case 'close': hidePanel(); break;
      case 'attack': marchDialog('attack', h); break;
      case 'gather': marchDialog('gather', h); break;
      case 'scout': {
        const type = h.type === 'dragon' ? 'camp' : h.type;
        const r = CH.World.sendMarch(s, 'scout', { type, id: h.o.id }, {}, null, null);
        if (!r.ok) return fail(r);
        UI.toast('Scouts dispatched. Report in ' + U.time((r.march.t1 - Date.now()) / 1000), 'good'); CH.App.persist(); renderBar(true); break;
      }
      case 'report': { const rep = s.reports.find(r => r.kind === 'scout' && r.targetId === h.o.id); if (rep) showReport(rep); break; }
      case 'enter': close(); break;
      case 'court': royalCourt(); break;
      case 'ranks': UI.sheet('ranks', 'throne'); break;
      case 'tele-random': { const r = CH.World.teleport(s, null, null); if (!r.ok) return fail(r); CH.Audio.play('magic'); CH.App.persist(); CH.App.wview.center(r.x, r.y); UI.toast('Teleported to (' + r.x + ', ' + r.y + ')', 'good'); hidePanel(); break; }
      case 'tele-pick': st.teleport = { x: W().px, y: W().py }; hidePanel(); UI.toast('Tap a spot on the map to teleport there', 'info'); teleportPanel(); break;
      case 'tele-here': st.teleport = { x: h.o.x, y: h.o.y }; teleportPanel(); break;
      case 'recall': if (CH.World.recall(s, b.dataset.id)) { UI.toast('March recalled', 'good'); CH.App.persist(); hidePanel(); renderBar(true); } break;
    }
  }
  function teleportPanel() {
    const s = save(), t = st.teleport, why = CH.World.canTeleport(s, t.x, t.y);
    $('wpanel').innerHTML = '<span class="kicker">Advanced teleport</span><h3>Move castle to (' + t.x + ', ' + t.y + ')?</h3><p class="' + (why ? 'warn' : 'muted') + '">' + (why || 'Uses an Advanced Teleport (you have ' + (s.items.teleAdvanced || 0) + '), or 300 gems. Incoming attacks lose track of you.') + '</p>' +
      '<div class="panel-actions"><button class="btn btn-gold" data-t="go"' + (why ? ' disabled' : '') + '>Teleport</button><button class="btn" data-t="cancel">Cancel</button></div>';
    $('wpanel').classList.remove('hidden');
    $('wpanel').onclick = e => {
      const b = e.target.closest('[data-t]'); if (!b || b.disabled) return;
      if (b.dataset.t === 'cancel') { st.teleport = null; hidePanel(); return; }
      const r = CH.World.teleport(s, t.x, t.y); if (!r.ok) return fail(r);
      st.teleport = null; CH.Audio.play('magic'); CH.App.persist(); hidePanel(); UI.toast('Castle teleported to (' + r.x + ', ' + r.y + ')', 'good');
    };
  }

  /* ---------------- March dialog ---------------- */
  function marchDialog(kind, h) {
    const s = save(), w = W(), o = h.o, type = h.type === 'dragon' ? 'camp' : h.type;
    const avail = Object.keys(s.army).filter(t => s.army[t] > 0).sort((a, b) => CH.TROOPS[b].power - CH.TROOPS[a].power);
    if (!avail.length) return fail({ reason: 'No troops at home. Train some or wait for marches to return.' });
    const sel = {}; for (const t of avail) sel[t] = kind === 'gather' ? 0 : s.army[t];
    if (kind === 'gather') { const tile = o; let need = tile.amt; for (const t of avail.slice().sort((a, b) => CH.TROOPS[b].load - CH.TROOPS[a].load)) { const n = Math.min(s.army[t], Math.ceil(need / CH.TROOPS[t].load)); sel[t] = n; need -= n * CH.TROOPS[t].load; if (need <= 0) break; } }
    const busy = CH.World.busyHeroes(s);
    const heroes = CH.HERO_ORDER.filter(id => s.heroes[id].unlocked && !busy.has(id));
    let hero = kind === 'attack' ? (heroes[0] || null) : null, formation = 'surround';
    const canRally = kind === 'attack' && s.faction != null && ['kingdom', 'fort', 'throne'].includes(type) && !(type === 'throne' && o.war && o.war.holder === 'player');
    const allies = canRally ? CH.Throne.rallyAllies(s, o) : [];
    let rally = false;
    const allyPow = allies.reduce((a, x) => a + CH.World.armyPower(x.army), 0);
    const est = () => {
      if (type === 'tile') return 0;
      if (type === 'throne') return o.war && !o.war.ended && o.war.holder !== 'player' ? CH.World.armyPower(o.war.garrison) * 1.6 : 0;
      if (type === 'kingdom') return CH.World.power(o);
      if (type === 'fort') return o.owner === 'player' ? 0 : 6000 * Math.pow(1.5, o.lvl);
      const mon = CH.World.campMonsters(o, w, Date.now()); let p = 0; for (const t in mon) p += mon[t] * Math.max(5, Math.sqrt((CH.ENEMIES[t].hp || 50) * (CH.ENEMIES[t].dmg || 5)) / 3) * (1 + 0.25 * o.lvl);
      return p;
    };
    const target = est();
    const rows = avail.map(t => '<div class="m-row"><canvas data-unit="' + CH.TROOPS[t].sprite + '" data-size="' + CH.TROOPS[t].size + '"></canvas><div class="m-name"><b>' + CH.TROOPS[t].name + '</b><span class="muted">' + CH.CLASS_NAMES[CH.TROOPS[t].cls] + ' · ' + U.fmt(s.army[t]) + ' home</span></div>' +
      '<input type="range" min="0" max="' + s.army[t] + '" value="' + sel[t] + '" data-t="' + t + '"><input type="number" inputmode="numeric" min="0" max="' + s.army[t] + '" value="' + sel[t] + '" data-n="' + t + '"></div>').join('');
    const heroRow = kind === 'attack' ? '<h4 class="group">Commander</h4><div class="row">' + ['', ...heroes].map(id => '<button class="tab' + ((hero || '') === id ? ' on' : '') + '" data-hero="' + id + '">' + (id ? CH.HEROES[id].name + ' L' + s.heroes[id].level : 'None') + '</button>').join('') + '</div>' : '';
    const rallyRow = canRally ? '<h4 class="group">Rally</h4><button class="tab" data-rally>' + (allies.length ? '⚔ Rally with ' + allies.length + ' ' + CH.FACTIONS[s.faction].name + ' allies (+' + U.fmt(allyPow) + ' power, gathers ' + CH.THRONE.rallyMuster + 's)' : 'No allies free to rally right now') + '</button>' : '';
    const formRow = kind === 'attack' && type !== 'camp' ? '<h4 class="group">Formation</h4><div class="row">' + [['surround', 'Surround', 'Attack from every side'], ['spearhead', 'Spearhead', 'One concentrated thrust'], ['pincer', 'Pincer', 'Two flanks at once']].map(([k, n, d]) => '<button class="tab' + (formation === k ? ' on' : '') + '" data-form="' + k + '" title="' + d + '">' + n + '</button>').join('') + '</div>' : '';
    const title = kind === 'gather' ? 'Gather at ' + CH.RES_TILES[o.type] : type === 'throne' ? (o.war && o.war.holder === 'player' ? 'Reinforce the ' : 'Attack the ') + CH.THRONE.name : 'Attack ' + (o.name || (h.type === 'dragon' ? 'the Elder Dragon' : type === 'fort' ? 'the fort' : type === 'ruin' ? 'the ruins' : CH.CAMP_TYPES[o.kind].name));
    UI.modal('<h3>' + esc(title) + '</h3><div class="row"><button class="btn btn-quiet" data-q="all">All</button><button class="btn btn-quiet" data-q="half">Half</button><button class="btn btn-quiet" data-q="none">Clear</button></div>' +
      '<div class="m-list">' + rows + '</div>' + heroRow + formRow + rallyRow + '<div class="m-sum" id="m-sum"></div><button class="btn btn-gold btn-lg btn-block" data-send>March!</button>',
    { cls: 'wide', onClick: e => {
      const q = e.target.closest('[data-q]'), hb = e.target.closest('[data-hero]'), fb = e.target.closest('[data-form]');
      if (e.target.closest('[data-rally]') && allies.length) { rally = !rally; e.target.closest('[data-rally]').classList.toggle('on', rally); summary(); }
      if (q) { for (const t of avail) sel[t] = q.dataset.q === 'all' ? s.army[t] : q.dataset.q === 'half' ? Math.floor(s.army[t] / 2) : 0; sync(); }
      if (hb) { hero = hb.dataset.hero || null; document.querySelectorAll('[data-hero]').forEach(x => x.classList.toggle('on', x === hb)); summary(); }
      if (fb) { formation = fb.dataset.form; document.querySelectorAll('[data-form]').forEach(x => x.classList.toggle('on', x === fb)); }
      if (e.target.closest('[data-send]')) {
        const r = CH.World.sendMarch(s, kind, { type, id: o.id }, { ...sel }, hero, formation, Date.now(), { rally });
        if (!r.ok) return fail(r);
        CH.Audio.play('horn'); UI.closeModal(); hidePanel(); CH.App.persist(); renderBar(true);
        UI.toast('Your army marches! Arrival in ' + U.time((r.march.t1 - Date.now()) / 1000), 'good');
      }
    } });
    const m = $('modal');
    m.oninput = e => { const t = e.target.dataset.t || e.target.dataset.n; if (!t) return; sel[t] = U.clamp(Math.floor(+e.target.value || 0), 0, s.army[t]); sync(e.target); };
    function sync(src) { m.querySelectorAll('[data-t]').forEach(x => { if (x !== src) x.value = sel[x.dataset.t]; }); m.querySelectorAll('[data-n]').forEach(x => { if (x !== src) x.value = sel[x.dataset.n]; }); summary(); }
    function summary() {
      const n = Object.values(sel).reduce((a, x) => a + x, 0), pow = (CH.World.armyPower(sel) + (rally ? allyPow : 0)) * (hero ? 1.1 : 1), load = CH.World.loadOf(sel);
      const secs = CH.World.marchSeconds({ x: w.px, y: w.py }, o, sel, CH.World.marchSpeedMult(s, hero), kind);
      const odds = kind === 'attack' && target ? pow / target : null;
      const gatherInfo = kind === 'gather' ? '<span>Brings home ' + U.fmt(Math.min(load, o.amt)) + ' ' + o.type + ' in ~' + U.time(secs * 2 + Math.min(load, o.amt) / (6 * o.lvl * (CH.World.evOn(w, Date.now(), 'resourceRush') ? 2 : 1))) + '</span>' : '';
      $('m-sum').innerHTML = '<span>' + U.fmt(n) + ' troops</span><span>Power ' + U.fmt(pow) + '</span><span>Load ' + U.fmt(load) + '</span><span>' + icon('time') + U.time(secs) + '</span>' + gatherInfo +
        (odds ? '<span class="' + (odds > 1.3 ? 'good' : odds > 0.9 ? '' : 'warn') + '">' + (odds > 1.3 ? 'Favourable' : odds > 0.9 ? 'Even fight' : 'Risky') + ' vs ~' + U.fmt(target) + '</span>' : '');
    }
    summary();
  }

  /* ---------------- Royal Court (player king hands out the treasure) ---------------- */
  function royalCourt() {
    const s = save(), th = W().throne, TH = CH.THRONE;
    if (!CH.Throne.isPlayerKing(s)) return;
    const cands = W().kingdoms.slice().sort((a, b) => (b.f === s.faction) - (a.f === s.faction) || CH.World.power(b) - CH.World.power(a)).slice(0, 12);
    const rows = th.prizes.map(p => {
      const d = TH.prizes.find(x => x.tier === p.tier);
      const to = p.given ? (p.given === 'player' ? 'You' : CH.Throne.keyName(s, p.given)) : null;
      return '<div class="b-row"><div class="b-info"><b>' + d.name + '</b><span class="muted">' + UI.reward(d.reward) + '</span></div>' +
        (to ? '<span class="good">→ ' + esc(to) + '</span>' : '<select data-pz="' + p.id + '"><option value="">Give to…</option><option value="player">Keep for yourself</option>' + cands.map(k => '<option value="' + k.id + '">' + esc(k.name) + (k.f === s.faction ? ' (ally)' : '') + '</option>').join('') + '</select>') + '</div>';
    }).join('');
    UI.modal('<h3>🎁 Royal Court</h3><p class="muted">As ' + TH.title + ' you hand out the Citadel\'s treasure. You may keep one chest of each kind. Kingdoms you reward stay loyal and won\'t attack you during your reign.</p><div class="b-list">' + rows + '</div>', { cls: 'wide' });
    $('modal').onchange = e => {
      const sel = e.target.closest('[data-pz]'); if (!sel || !sel.value) return;
      const r = CH.Throne.distribute(s, sel.dataset.pz, sel.value);
      if (!r.ok) { fail(r); sel.value = ''; return; }
      CH.Audio.play('victory'); CH.App.persist(); UI.closeModal(); royalCourt();
    };
  }

  /** Gold banner while the Throne War is live (kingdom and world screens). */
  function warBanner() {
    const s = save(), w = W(), el = $('warbar');
    if (!w || !w.throne || !el) return;
    const now = Date.now(), war = w.throne.war;
    if (war && !war.ended && now < war.end) {
      const txt = '👑 Throne War · ' + U.time((war.end - now) / 1000) + ' left · held by ' + CH.Throne.keyName(s, war.holder);
      if (el.textContent !== txt) el.textContent = txt;
      el.classList.remove('hidden');
    } else el.classList.add('hidden');
  }

  /* ---------------- Marches drawer ---------------- */
  function renderBar(force) {
    const s = save(), w = W(), now = Date.now();
    if (!w) return;
    const mine = w.marches.filter(m => m.owner === 'player'), inc = CH.World.incoming(s);
    const key = mine.map(m => m.id + m.kind).join() + '|' + inc.length + '|' + st.drawer + '|' + Math.floor(now / 1000);
    if (!force && key === st.barKey) return;
    st.barKey = key;
    const slots = S.marchSlots(s), used = mine.filter(m => m.kind !== 'return' && m.kind !== 'scout').length;
    $('wbar').innerHTML = '<button class="chip-btn" data-b="toggle">' + icon('swords') + 'Marches ' + used + '/' + slots + (inc.length ? ' <b class="alert-dot">' + inc.length + '!</b>' : '') + '</button>' +
      (st.drawer ? '<div class="m-drawer">' + (mine.concat(inc).map(m => {
        const left = Math.max(0, (m.t1 - now) / 1000), hostile = m.owner !== 'player';
        return '<div class="m-item' + (hostile ? ' hostile' : '') + '"><span>' + (hostile ? '⚠ ' + esc(W().kingdoms.find(k => k.id === m.owner).name) + ' → you' : m.kind + ' → ' + esc(describeTarget(m))) + '</span><b>' + U.time(left) + '</b>' +
          '<button class="btn btn-quiet" data-b="go" data-x="' + m.tx + '" data-y="' + m.ty + '">View</button>' + (!hostile && m.kind !== 'return' ? '<button class="btn btn-quiet" data-b="recall" data-id="' + m.id + '">Recall</button>' : '') + '</div>';
      }).join('') || '<p class="muted">No marches.</p>') + '</div>' : '');
  }
  function onBar(e) {
    const b = e.target.closest('[data-b]'); if (!b) return;
    CH.Audio.play('click');
    if (b.dataset.b === 'toggle') st.drawer = !st.drawer;
    else if (b.dataset.b === 'go') CH.App.wview.center(+b.dataset.x, +b.dataset.y);
    else if (b.dataset.b === 'recall') { if (CH.World.recall(save(), b.dataset.id)) { CH.App.persist(); UI.toast('March recalled', 'good'); } }
    renderBar(true);
  }

  /* ---------------- Reports ---------------- */
  function sideTable(side, label) {
    if (!side) return '';
    const rows = Object.keys(side.sent || {}).map(t => '<tr><td>' + troopIcon(t, side.sent[t]) + '</td><td>' + (CH.TROOPS[t] ? CH.TROOPS[t].name : (CH.ENEMIES[t] || {}).name || t) + '</td><td class="warn">−' + U.fmt((side.lost || {})[t] || 0) + '</td></tr>').join('');
    return '<div class="rep-side"><h4>' + label + ': ' + esc(side.name) + (side.hero ? ' <span class="muted">with ' + CH.HEROES[side.hero].name + '</span>' : '') + (side.helpers ? ' <span class="good">+' + side.helpers + ' allied</span>' : '') + '</h4><table class="rep-table">' + rows + '</table></div>';
  }
  function showReport(rep) {
    const s = save();
    if (!rep.read) { rep.read = true; s.unread = s.reports.filter(x => !x.read).length; CH.App.persist(); }
    let html = '<span class="kicker">' + new Date(rep.t).toLocaleString() + (rep.coords ? ' · (' + rep.coords.join(', ') + ')' : '') + '</span><h3>' + esc(rep.title) + '</h3>';
    if (rep.kind === 'scout' && rep.res) {
      UI.painters['scout' + rep.id] = cv => CH.View.layoutPreview(cv, rep.layout, { cl: rep.cl, area: (() => { const [w2, h2] = CH.CONFIG.AREA[rep.cl - 1]; return { x: Math.floor((30 - w2) / 2), y: Math.floor((22 - h2) / 2), w: w2, h: h2 }; })() });
      html += '<dl class="stats"><div><dt>Castle</dt><dd>' + rep.cl + '</dd></div><div><dt>Temperament</dt><dd>' + rep.personality + '</dd></div><div><dt>Power</dt><dd>' + U.fmt(rep.power) + '</dd></div><div><dt>Troops</dt><dd>' + (rep.scoutLvl ? '' : '~') + U.fmt(rep.troopsTotal) + '</dd></div>' + (rep.hero ? '<div><dt>Hero</dt><dd>' + CH.HEROES[rep.hero.id].name + ' L' + rep.hero.level + '</dd></div>' : '') + '</dl>' +
        '<p class="muted">Resources' + (rep.scoutLvl >= 2 ? '' : ' (rounded)') + ':</p><div class="chips">' + UI.reward(rep.res) + '</div><p class="muted">Lootable now:</p><div class="chips">' + UI.reward(rep.loot) + '</div>' +
        (rep.troops ? '<div class="tchips">' + armyList(rep.troops) + '</div>' : rep.byClass ? '<div class="chips">' + Object.entries(rep.byClass).map(([c, n]) => '<span class="chip">' + CH.CLASS_NAMES[c] + ' ' + U.fmt(n) + '</span>').join('') + '</div>' : '<p class="muted">Research Scouting at the Academy to see their troops.</p>') +
        '<canvas class="rep-map" data-paint="scout' + rep.id + '"></canvas>' + (rep.hist && rep.hist.length ? '<p class="muted">Recent: ' + rep.hist.map(h => esc(h.text)).join(' · ') + '</p>' : '');
    } else if (rep.kind === 'scout') html += '<div class="tchips">' + armyList(rep.monsters) + '</div>';
    if (rep.atk) {
      const badge = { win: 'Victory', partial: 'Partial victory', loss: 'Defeat', bounced: 'Turned back' }[rep.outcome];
      html += '<p class="badge ' + rep.outcome + '">' + badge + (rep.time ? ' · ' + rep.time + 's' : '') + (rep.destruction != null ? ' · ' + rep.destruction + '% of buildings destroyed' : '') + '</p>' +
        '<div class="rep-sides">' + sideTable(rep.atk, 'Attacker') + sideTable(rep.def, 'Defender') + '</div>';
      if (rep.loot && Object.values(rep.loot).some(n => n > 0)) html += '<p class="muted">' + (rep.you === 'def' ? 'Resources stolen from you:' : 'Loot carried home:') + '</p><div class="chips">' + UI.reward(rep.loot) + '</div>';
      if (rep.reward && Object.values(rep.reward).some(n => n > 0)) html += '<p class="muted">Rewards:</p><div class="chips">' + UI.reward(rep.reward) + Object.keys(rep.items || {}).map(i => '<span class="chip">' + CH.ITEMS[i].name + '</span>').join('') + '</div>';
      if (rep.casualties) html += '<p class="muted">Your casualties: ' + U.fmt(rep.casualties.wounded) + ' wounded (infirmary), ' + U.fmt(rep.casualties.dead) + ' dead.</p>';
      if (rep.dmg) html += '<p class="muted">Damage dealt: attackers ' + U.fmt(rep.dmg.atk) + ' · defenders ' + U.fmt(rep.dmg.def) + '</p>';
    }
    const acts = [];
    if (rep.replay) acts.push('<button class="btn btn-gold" data-r="watch">▶ Watch battle</button>');
    if (rep.atk && rep.you === 'def' && rep.atk.id) acts.push('<button class="btn" data-r="revenge">⚔ Revenge</button>');
    if (rep.coords) acts.push('<button class="btn" data-r="map">Show on map</button>');
    UI.modal(html + '<div class="row">' + acts.join('') + '</div>', { cls: 'wide', onClick: e => {
      const b = e.target.closest('[data-r]'); if (!b) return;
      UI.closeModal();
      if (b.dataset.r === 'watch') Replay.open(rep);
      else {
        UI.closeSheets();
        const k = rep.atk && rep.atk.id ? W().kingdoms.find(x => x.id === rep.atk.id) : null;
        open({ x: rep.coords[0], y: rep.coords[1] });
        if (b.dataset.r === 'revenge' && k) select({ type: 'kingdom', o: k }); else selectAt(rep.coords[0], rep.coords[1]);
      }
    } });
  }

  /* ---------------- Incoming attacks ---------------- */
  function incomingModal() {
    const s = save(), inc = CH.World.incoming(s), now = Date.now(), wt = S.highestLevel(s, 'watchtower');
    if (!inc.length) return;
    const m = inc[0], k = W().kingdoms.find(x => x.id === m.owner);
    const n = CH.World.armyCount(m.army);
    const intel = wt >= 5 ? '<div class="tchips">' + armyList(m.army) + '</div><p class="muted">Led by ' + CH.HEROES[m.hero].name + ' (level ' + m.heroLevel + ').</p>'
      : wt >= 3 ? '<p>About <b>' + U.fmt(Math.round(n / 50) * 50) + '</b> troops. Upgrade the Watchtower to level 5 to see exact troops.</p>'
        : wt >= 1 ? '<p class="muted">Upgrade the Watchtower to level 3 to see their army size.</p>' : '<p class="muted">Build a Watchtower to learn more about incoming armies.</p>';
    const hasShield = (s.items.shield2h || 0) + (s.items.shield8h || 0);
    UI.modal('<h3 class="danger-title">⚔ ' + esc(k.name) + ' is attacking!</h3><p>Their army arrives in <b id="inc-eta">' + U.time((m.t1 - now) / 1000) + '</b>. ' + esc(k.ruler) + ' · castle ' + k.cl + (k.grudge ? ' · holds a grudge against you' : '') + '</p>' + intel +
      '<h4 class="group">Prepare</h4><ul class="bullets"><li>Every troop at home defends, together with your towers, walls and traps.</li><li>Your defense hero: <b>' + (s.defenseHero ? CH.HEROES[s.defenseHero].name : 'none') + '</b> (change it in Heroes).</li><li>Raise a Peace Shield and the army will turn back.</li><li>Teleporting away makes them lose track of you.</li></ul>' +
      '<div class="row"><button class="btn btn-gold" data-i="shield"' + (hasShield || s.res.gems >= 200 ? '' : ' disabled') + '>🛡 Peace Shield (' + (hasShield ? 'use item' : '200 gems') + ')</button><button class="btn" data-i="help">Request faction help</button><button class="btn" data-i="map">Show on map</button></div>',
    { onClick: e => {
      const b = e.target.closest('[data-i]'); if (!b || b.disabled) return;
      if (b.dataset.i === 'shield') {
        const id = s.items.shield2h ? 'shield2h' : s.items.shield8h ? 'shield8h' : null;
        if (id) S.useItem(s, id); else { s.res.gems -= 200; s.shieldUntil = Math.max(s.shieldUntil, Date.now()) + 2 * 3600e3; }
        CH.App.persist(); UI.closeModal(); UI.toast('Peace Shield raised. The enemy will turn back.', 'good'); CH.Audio.play('heal');
      } else if (b.dataset.i === 'help') { const r = CH.World.requestHelp(s); if (!r.ok) return fail(r); CH.App.persist(); UI.toast(r.troops + ' allied troops will help defend you for 30 minutes', 'good'); }
      else { UI.closeModal(); UI.closeSheets(); open({ x: m.fx + (m.tx - m.fx) * 0.5, y: m.fy + (m.ty - m.fy) * 0.5 }); }
    } });
  }

  /* ---------------- Battle replay ---------------- */
  const Replay = {
    open(rep) {
      const app = CH.App;
      UI.closeSheets(); UI.closeModal();
      this.rep = rep; this.b = CH.Siege.create(JSON.parse(JSON.stringify(rep.replay))); this.speed = 1; this.paused = false; this.acc = 0; this.wasMode = app.mode;
      this.b.onEvent = (t, d) => { if (t === 'sfx') CH.Audio.play(d); };
      app.mode = 'replay';
      document.body.classList.remove('in-world'); document.body.classList.add('in-battle');
      $('wmap').classList.add('hidden');
      app.view.handler = { tap() {}, dragStart() { return false; } };
      const cl = Math.min(8, rep.replay.cl), [w, h] = CH.CONFIG.AREA[cl - 1];
      app.view.frame({ x: (30 - w) / 2, y: (22 - h) / 2, w, h }, app.view.w < 760 ? 1 : 2.5);
      $('rhud').classList.remove('hidden');
      $('rhud').innerHTML = '<div class="r-top"><button class="icon-btn" data-rp="close">' + icon('close') + '</button><div class="r-names"><b class="blue">' + esc(rep.replay.names[rep.replay.playerSide === 'atk' ? 'atk' : 'def']) + '</b> vs <b class="red">' + esc(rep.replay.names[rep.replay.playerSide === 'atk' ? 'def' : 'atk']) + '</b></div>' +
        '<button class="hud-pill" data-rp="pause">❚❚</button><button class="hud-pill" data-rp="speed">1×</button><button class="hud-pill" data-rp="skip">⏭</button></div><div class="r-bars" id="r-bars"></div><div class="r-time" id="r-time"></div>';
      $('rhud').onclick = e => {
        const b = e.target.closest('[data-rp]'); if (!b) return;
        const k = b.dataset.rp;
        if (k === 'close') this.close();
        else if (k === 'pause') { this.paused = !this.paused; b.textContent = this.paused ? '▶' : '❚❚'; }
        else if (k === 'speed') { this.speed = this.speed >= 3 ? 1 : this.speed + 1; b.textContent = this.speed + '×'; }
        else if (k === 'skip') { while (!this.b.result) this.b.update(this.b.stepDt); }
      };
      CH.Audio.startMusic('boss');
    },
    tick(dt) {
      const b = this.b; if (!b) return;
      if (!this.paused && !b.result) { this.acc += dt * this.speed; let n = 0; while (this.acc >= b.stepDt && n++ < 20) { b.update(b.stepDt); this.acc -= b.stepDt; } }
      else if (b.result) b.updateFx(dt);
      const alive = side => { let n = 0; for (const u of b.squads) if (u.side === side && !u.dead) n += Math.ceil(Math.max(0, u.hp) / u.unitHp - 1e-6); for (const d of b.deployQ) if (d.sq && side === 'atk') n += d.sq.count; return n; };
      const ps = b.playerSide, es = ps === 'atk' ? 'def' : 'atk';
      $('r-bars').innerHTML = '<span class="blue">' + U.fmt(alive(ps)) + ' troops</span><span class="red">' + U.fmt(alive(es)) + ' troops</span>';
      $('r-time').textContent = b.result ? (b.result === 'win' ? 'Victory' : 'Defeat') + ' · ' + Math.round(b.time) + 's' : U.time(Math.max(0, b.timeLimit - b.time)) + ' left';
      CH.View.drawBattle(CH.App.view, b, {}, b.time);
      if (b.result && !this.doneShown) { this.doneShown = true; setTimeout(() => { if (this.b === b) { const rep = this.rep; this.close(); showReport(rep); } }, 2200); }
    },
    close() {
      this.b = null; this.doneShown = false;
      $('rhud').classList.add('hidden'); $('rhud').innerHTML = '';
      document.body.classList.remove('in-battle');
      if (this.wasMode === 'world') open(); else CH.App.goHome(true);
    },
  };

  /* ---------------- While you were away ---------------- */
  function offlineSummary(info) {
    const s = save();
    const lines = [];
    for (const r in info.res) if (Math.abs(info.res[r]) >= 1) lines.push('<span class="chip">' + icon(r) + (info.res[r] > 0 ? '+' : '') + U.fmt(info.res[r]) + '</span>');
    const reps = s.reports.filter(r => r.t > info.since);
    const news = s.world.news.filter(n => n.t > info.since).slice(0, 8);
    UI.modal('<h3>While you were away (' + U.time(info.sec) + ')</h3>' + (lines.length ? '<p class="muted">Resources:</p><div class="chips">' + lines.join('') + '</div>' : '') +
      (reps.length ? '<h4 class="group">Your reports</h4><div class="b-list">' + reps.slice(0, 6).map(r => '<button class="b-row" data-rep="' + r.id + '"><div class="b-info"><b>' + esc(r.title) + '</b><span class="muted">' + U.time((Date.now() - r.t) / 1000) + ' ago</span></div></button>').join('') + '</div>' : '') +
      (news.length ? '<h4 class="group">News of the realm</h4><ul class="news">' + news.map(n => '<li>' + esc(n.text) + '</li>').join('') + '</ul>' : '') +
      '<button class="btn btn-gold btn-block" data-close>To my kingdom</button>',
    { cls: 'wide', onClick: e => { const b = e.target.closest('[data-rep]'); if (b) { const r = s.reports.find(x => x.id === b.dataset.rep); if (r) showReport(r); } } });
  }

  function tick() {
    warBanner();
    if (CH.App.mode !== 'world') return;
    const s = save(), w = W();
    const c = CH.App.wview.toWorld(CH.App.wview.canvas.getBoundingClientRect().left + CH.App.wview.w / 2, CH.App.wview.canvas.getBoundingClientRect().top + CH.App.wview.h / 2);
    const el = $('w-coords'); if (el) el.textContent = 'X ' + Math.floor(c.x / TW) + ' · Y ' + Math.floor(c.y / TW);
    const ur = $('w-unread'); if (ur) ur.textContent = s.unread || '';
    renderBar(false);
    if (st.sel && st.sel.type === 'march' && !w.marches.includes(st.sel.o)) hidePanel();
    CH.App.wview.draw(s, { now: Date.now(), filters: st.filters, selected: st.sel ? { x: st.sel.type === 'march' ? marchPos(st.sel.o).x : st.sel.o.x, y: st.sel.type === 'march' ? marchPos(st.sel.o).y : st.sel.o.y } : null, teleport: st.teleport });
  }

  return { royalCourt, warBanner, open, close, tick, showReport, incomingModal, offlineSummary, Replay, select, state: st, renderBar };
})();

</script>
  <script>/* js/main.js */
/* =====================================================================
 * Eldoria — main.js
 * Boots the game and owns the top-level flow:
 *   title → kingdom (home) ⇄ battles (campaign / raid / defense) → results
 * Rewards from battles are applied here, in one place.
 * ===================================================================== */
CH.App = (function () {
  const UI = CH.UI, S = CH.State, U = CH.util, $ = UI.$;
  const app = { save: null, view: null, mode: 'title', battle: null, saveTimer: 0, tickTimer: 0 };

  app.persist = () => S.save(app.save);

  app.handleEvents = evs => {
    for (const e of evs || []) {
      if (e.kind === 'trained') UI.toast(U.fmt(e.n || 1) + ' ' + CH.TROOPS[e.type].name + ' trained', 'good');
      else if (e.kind === 'healed') UI.toast(U.fmt(e.n) + ' troops recovered in the infirmary', 'good');
      else if (e.kind === 'starving') UI.toast('Your granaries are empty! ' + U.fmt(e.lost) + ' troops deserted. Build farms or train fewer troops.', 'bad');
      if (e.kind === 'built') { UI.toast(CH.BUILDINGS[e.type].name + (e.level > 1 ? ' upgraded to level ' + e.level : ' finished'), 'good'); CH.Audio.play('upgrade'); }
      else if (e.kind === 'research') UI.toast((e.rkind === 'troop' ? CH.TROOPS[e.id].name : CH.SPELLS[e.id].name) + ' research reached level ' + e.level, 'good');
      else if (e.kind === 'cleared') UI.toast('Cleared! ' + Object.entries(e.got).filter(([k]) => k !== 'levels').map(([k, v]) => '+' + v + ' ' + k).join(', ') + (e.gems ? ' and found ' + e.gems + ' gems!' : ''), 'good');
      if (e.levels) for (const l of e.levels) levelUp(l);
    }
    if (evs && evs.length) { app.persist(); CH.Home.refreshHud(true); if (UI.sheetOpen()) UI.refreshSheet(); }
  };
  function levelUp(l) { UI.toast('Player level ' + l.level + '! +' + l.gems + ' gems', 'good'); CH.Audio.play('star'); }

  /* ---------------- Home ---------------- */
  app.goHome = function (reframe) {
    app.mode = 'home'; app.battle = null;
    CH.BattleUI.close();
    document.body.classList.remove('in-world');
    $('wmap').classList.add('hidden');
    document.body.classList.remove('in-battle');
    app.view.handler = CH.Home.handler;
    if (reframe !== false) app.view.frame(S.area(app.save), app.view.w < 760 ? 0.4 : 1);
    CH.Home.cancelPlacement(); CH.Home.deselect();
    CH.Home.refreshHud(true);
    CH.Audio.startMusic('menu');
  };

  /* ---------------- Battles ---------------- */
  app.startBattle = function (cfg) {
    const s = app.save;
    UI.closeSheets(); UI.closeModal(); CH.Home.cancelPlacement(); CH.Home.deselect();
    const b = new CH.Battle({ ...cfg, save: s, layout: cfg.mode === 'defense' ? s.buildings : undefined });
    b.onEvent = CH.BattleUI.onEvent;
    app.battle = b; app.mode = 'battle';
    document.body.classList.add('in-battle');
    app.view.handler = CH.BattleUI.handler;
    const mg = app.view.w < 760 ? 0.5 : 2;
    if (cfg.mode === 'defense') app.view.frame(S.area(s), mg);
    else if (cfg.mode === 'raid') { const [w, h] = CH.CONFIG.AREA[cfg.opponent.cl - 1]; app.view.frame({ x: (CH.CONFIG.COLS - w) / 2, y: (CH.CONFIG.ROWS - h) / 2, w, h }, Math.max(1, mg)); }
    else {
      // Wide campaign maps: on portrait phones fill the height (tappable tiles) and start on the castle.
      const core = cfg.stage.tpl.core, T = CH.CONFIG.T;
      if (app.view.portrait) app.view.frame({ x: 0, y: 0, w: CH.CONFIG.COLS, h: CH.CONFIG.ROWS }, 0, 'height', { x: (core.tx + 0.5) * T, y: CH.CONFIG.ROWS * T / 2 });
      else app.view.frame({ x: 0, y: 0, w: CH.CONFIG.COLS, h: CH.CONFIG.ROWS }, 0);
    }
    CH.BattleUI.open(b);
    CH.Audio.startMusic('battle', cfg.mode === 'campaign' ? 45 + cfg.stage.r : 48);
  };

  /** Apply the outcome of a battle to the save and show the results screen. */
  app.endBattle = function (b) {
    if (!b || b !== app.battle || b.applied) return;
    b.applied = true;
    const s = app.save, win = b.result === 'win';
    for (const t in b.used) s.army[t] = Math.max(0, (s.army[t] || 0) - b.used[t]);
    let html = '', got = {}, actions = '';
    const cl = S.castleLevel(s);
    if (b.mode === 'raid') {
      const op = b.opponent, lg = b.lootGot, stars = b.stars;
      const bonus = win ? Math.round((60 + 60 * cl) * stars) : 0;
      got = S.give(s, { gold: Math.floor(lg.gold) + bonus, wood: Math.floor(lg.wood) + bonus, stone: Math.floor(lg.stone + bonus * 0.6), gems: Math.floor(lg.gems), xp: 12 + Math.round(b.destruction / 3) });
      const tro = win ? Math.max(5, Math.round(op.trophyWin * (0.6 + stars * 0.15))) : -op.trophyLoss;
      s.raid.trophies = Math.max(0, s.raid.trophies + tro);
      s.raid.attacks++; if (win) s.raid.wins++;
      s.stats.buildingsRaided += b.stats.destroyed;
      s.raid.opponents = s.raid.opponents.filter(o => o.id !== op.id);
      html = resultHead(win ? 'Victory!' : 'Defeat', b.reason, stars, 3) + '<p class="big-num">' + b.destruction + '% destroyed</p>' +
        '<div class="res-lines">' + line('Loot taken', UI.reward({ gold: Math.floor(lg.gold), wood: Math.floor(lg.wood), stone: Math.floor(lg.stone), gems: Math.floor(lg.gems) })) + (bonus ? line('Star bonus', UI.reward({ gold: bonus, wood: bonus, stone: Math.floor(bonus * 0.6) })) : '') +
        line('Trophies', '<span class="chip">' + UI.icon('trophy') + (tro >= 0 ? '+' : '') + tro + '</span>') + '</div>' + capNote(s, got);
      actions = '<button class="btn btn-gold btn-lg" data-r="raid">Raid another kingdom</button>';
    } else if (b.mode === 'defense') {
      const reached = b.wave - (b.waveCleared ? 0 : 1);
      const bank = b.bank;
      const record = reached > s.defense.best;
      if (record) s.defense.best = reached;
      s.defense.runs++; s.stats.enemiesSlain += b.stats.kills;
      const ms = CH.Defense.MILESTONES.filter(m => reached >= m.wave && !s.defense.claimed.includes(m.wave));
      let mGems = 0, mRunes = 0;
      for (const m of ms) { s.defense.claimed.push(m.wave); mGems += m.gems; mRunes += m.runes; }
      got = S.give(s, { gold: bank.gold, wood: bank.wood, stone: bank.stone, gems: bank.gems + mGems, runes: bank.runes + mRunes, xp: bank.xp });
      html = resultHead(record ? 'New record!' : 'The defense ends', b.reason, 0, 0) + '<p class="big-num">Survived ' + reached + ' wave' + (reached === 1 ? '' : 's') + '</p>' +
        '<div class="res-lines">' + line('Rewards banked', UI.reward({ gold: bank.gold, wood: bank.wood, stone: bank.stone, gems: bank.gems, runes: bank.runes, xp: bank.xp })) +
        (ms.length ? line('Record milestones', UI.reward({ gems: mGems, runes: mRunes })) : '') + line('Enemies slain', '<b>' + b.stats.kills + '</b>') + '</div>' + capNote(s, got) +
        '<p class="muted">Your real buildings are never damaged by Endless Defense.</p>';
      actions = '<button class="btn btn-gold btn-lg" data-r="defense">Defend again</button>';
    } else {
      const st = b.stage, prev = s.campaign[st.id] || 0;
      s.stats.enemiesSlain += b.stats.kills;
      if (win) {
        const stars = b.campaignStars();
        const rw = prev ? { gold: Math.round(st.reward.gold * 0.25), wood: Math.round(st.reward.wood * 0.25), stone: Math.round(st.reward.stone * 0.25), xp: Math.round(st.reward.xp * 0.3) } : { ...st.reward };
        if (stars === 3 && prev < 3) rw.gems = (rw.gems || 0) + 2;
        s.campaign[st.id] = Math.max(prev, stars);
        s.stats.battlesWon++;
        got = S.give(s, rw);
        const next = st.s < 5 ? st.r + '-' + (st.s + 1) : st.r < 5 ? (st.r + 1) + '-0' : null;
        html = resultHead('Victory!', b.reason, stars, 3) + '<div class="res-lines">' + line(prev ? 'Replay reward' : 'First clear reward', UI.reward(rw)) + '</div>' + capNote(s, got) +
          (st.s === 5 && st.r < 5 ? '<p class="good">' + (S.castleLevel(s) >= CH.REGIONS[st.r + 1].castle ? 'New region unlocked: ' + CH.REGIONS[st.r + 1].name + '!' : 'Upgrade your castle to level ' + CH.REGIONS[st.r + 1].castle + ' to enter ' + CH.REGIONS[st.r + 1].name + '.') + '</p>' : '');
        if (next) { const [nr, ns] = next.split('-').map(Number); if (CH.Campaign.stageUnlocked(s, nr, ns)) actions = '<button class="btn btn-gold btn-lg" data-r="next" data-id="' + next + '">Next stage</button>'; }
      } else {
        html = resultHead('Defeat', b.reason, 0, 3) + '<p>' + campaignTip(b) + '</p>';
        actions = '<button class="btn btn-gold btn-lg" data-r="retry">Try again</button>';
      }
    }
    if (got.levels) got.levels.forEach(levelUp);
    app.persist();
    UI.modal('<div class="results ' + (win ? 'win' : 'lose') + '">' + html + '<div class="row center">' + actions + '<button class="btn" data-r="home">Return to kingdom</button></div></div>', {
      noClose: true, cls: 'results-card',
      onClick: e => {
        const r = e.target.closest('[data-r]'); if (!r) return;
        CH.Audio.play('click'); UI.closeModal();
        const k = r.dataset.r;
        app.goHome(true);
        if (k === 'raid') UI.sheet('raidTargets');
        else if (k === 'defense') app.startBattle({ mode: 'defense' });
        else if (k === 'retry') app.startBattle({ mode: 'campaign', stage: b.stage });
        else if (k === 'next') { const [nr, ns] = r.dataset.id.split('-').map(Number); app.startBattle({ mode: 'campaign', stage: CH.Campaign.stage(nr, ns) }); }
      },
    });
    CH.Audio.startMusic('menu');
  };
  function resultHead(title, reason, stars, max) {
    return '<h2>' + title + '</h2><p class="muted">' + UI.esc(reason || '') + '</p>' + (max ? '<div class="big-stars">' + Array.from({ length: max }, (_, i) => '<span class="bstar' + (i < stars ? ' on' : '') + '" style="--i:' + i + '">' + UI.ICONS.star + '</span>').join('') + '</div>' : '');
  }
  const line = (k, v) => '<div class="res-line"><span>' + k + '</span><span>' + v + '</span></div>';
  function capNote(s, got) {
    const full = ['gold', 'wood', 'stone'].filter(r => s.res[r] >= S.capacity(s, r));
    return full.length ? '<p class="warn">Your ' + full.join(' and ') + ' storage is full; some rewards were lost. Upgrade storage buildings.</p>' : '';
  }
  function campaignTip(b) {
    if (b.stage.obj === 'timed') return 'Time ran out. Build more towers early and call waves sooner.';
    if (b.boss) return 'The boss broke through. Place towers near the end of its road and save spells for it.';
    return 'Build towers at the bends of the road so they hit enemies twice, deploy troops to block, and upgrade your home defenses to make campaign towers stronger.';
  }

  /* ---------------- Title & intro ---------------- */
  function titleScreen() {
    const t = $('title');
    t.innerHTML = '<div class="title-inner"><h1><span>Eldo</span><span>ria</span></h1><p class="tag">Sixty kingdoms. One crown. The world never sleeps.</p>' +
      '<button class="btn btn-gold btn-lg" id="t-play">' + (app.save.introSeen ? 'Enter your kingdom' : 'Found your kingdom') + '</button>' +
      '<div class="row center"><button class="btn btn-quiet" id="t-how">How to play</button><button class="btn btn-quiet" id="t-set">Settings</button></div>' +
      '<p class="t-foot">v' + CH.CONFIG.VERSION + ' · single-player with 60 AI kingdoms · progress saves in this browser</p></div>';
    t.classList.remove('hidden');
    $('t-play').onclick = () => { CH.Audio.ensure(); CH.Audio.play('heroDeploy'); t.classList.add('hidden'); app.goHome(true); if (!app.save.introSeen) intro(); else if (app.offlineInfo) { CH.WorldUI.offlineSummary(app.offlineInfo); app.offlineInfo = null; } };
    $('t-how').onclick = () => { CH.Audio.ensure(); t.classList.add('hidden'); app.goHome(true); UI.sheet('howto'); };
    $('t-set').onclick = () => { CH.Audio.ensure(); t.classList.add('hidden'); app.goHome(true); UI.sheet('settings'); };
  }
  function intro() {
    UI.modal('<h3>Welcome to Eldoria</h3><p>Your young kingdom stands on the green outer lands. Around you, 60 AI kingdoms grow, train armies and wage war on each other, and some will come for you.</p><ol class="bullets"><li>Collect resources and build a <b>Stone Quarry</b> and more <b>Farms</b>: troops eat food.</li><li>Train troops, then open the <b>World</b> map, <b>scout</b> a weak neighbour and <b>raid</b> it.</li><li>Clear monster camps for resources, items and hero experience.</li><li>Build a <b>Watchtower</b> before your beginner protection ends (castle level 3 or 45 minutes).</li></ol><p class="muted">The Tasks card always shows a good next step. The world keeps going while you are away.</p><button class="btn btn-gold btn-block" data-close>Rule wisely</button>',
      { onClose: () => { app.save.introSeen = true; app.persist(); } });
  }

  /* ---------------- Loop ---------------- */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
    const time = now / 1000;
    try {
      // The kingdom and the world keep simulating whatever screen is open.
      app.tickTimer -= dt;
      if (app.tickTimer <= 0) {
        app.tickTimer = 0.5;
        app.handleEvents(S.tick(app.save));
        app.worldEvents(CH.World.tick(app.save));
        if (app.mode === 'home') CH.Home.refreshHud();
      }
      if (app.mode === 'battle' && app.battle) {
        CH.BattleUI.tick(dt);
        CH.View.drawBattle(app.view, app.battle, CH.BattleUI.drawUi(), app.battle.time);
      } else if (app.mode === 'replay') {
        CH.WorldUI.Replay.tick(dt);
      } else if (app.mode === 'world') {
        CH.WorldUI.tick();
      } else if (app.view.w) {
        CH.Home.update(dt);
        CH.View.drawHome(app.view, app.save, { selected: CH.Home.state.selected, ghost: CH.Home.state.ghost, moving: CH.Home.state.moving, floaters: CH.Home.state.floaters }, time);
      }
      app.saveTimer -= dt;
      if (app.saveTimer <= 0) { app.saveTimer = 10; if (app.mode !== 'battle') app.persist(); }
    } catch (err) { console.error('[Eldoria] frame error', err); }
    requestAnimationFrame(frame);
  }

  /** Turns world-simulation events into notifications. */
  app.worldEvents = evs => {
    if (!evs.length) return;
    for (const e of evs) {
      if (e.kind === 'incoming') { const k = app.save.world.kingdoms.find(x => x.id === e.march.owner); UI.toast('⚔ ' + (k ? k.name : 'An army') + ' is marching on your kingdom!', 'bad'); CH.Audio.play('horn'); }
      else if (e.kind === 'report' && !app.booting) {
        const r = e.report;
        UI.toast((r.kind === 'defense' ? (r.outcome === 'win' ? '🛡 ' : '⚠ ') : '') + r.title, r.outcome === 'loss' ? 'bad' : r.outcome === 'win' ? 'good' : 'info');
        if (e.alert) CH.Audio.play(r.outcome === 'win' ? 'victory' : 'defeat');
      } else if (e.kind === 'event' && !app.booting) UI.toast('World event: ' + e.ev.name, 'info');
      else if (e.kind === 'returned' && !app.booting) { UI.toast('Your army returned with ' + Object.entries(e.cargo).filter(([k, v]) => v > 0 && k !== 'levels').map(([k, v]) => U.fmt(v) + ' ' + k).join(', '), 'good'); CH.Audio.play('collect'); }
    }
    app.persist();
    if (app.mode === 'home') CH.Home.refreshHud(true);
    // Only re-render an open screen when something it shows changed (keeps taps reliable).
    const cur = UI.sheetOpen() && UI.currentSheet();
    if ((cur === 'mail' && evs.some(e => e.kind === 'report')) || (cur === 'events' && evs.some(e => e.kind === 'event')) || (cur === 'army' && evs.some(e => e.kind === 'returned'))) UI.refreshSheet();
  };

  app.boot = function () {
    app.save = S.load();
    CH.World.ensure(app.save);
    // Offline progression: snapshot, simulate the elapsed time, then summarize.
    const before = { ...app.save.res }, since = app.save.lastSeen || Date.now(), away = (Date.now() - since) / 1000;
    app.booting = true;
    app.handleEvents(S.tick(app.save));
    app.worldEvents(CH.World.tick(app.save));
    app.booting = false;
    if (away > 300) {
      const diff = {}; for (const r of ['gold', 'wood', 'stone', 'food']) diff[r] = Math.round(app.save.res[r] - before[r]);
      app.offlineInfo = { res: diff, since, sec: away };
    }
    CH.Audio.apply(app.save.settings);
    app.view = new CH.View.View($('cv'));
    app.view.resize();
    app.wview = new CH.WorldView($('wcv'));
    new ResizeObserver(() => { if (app.mode === 'world') app.wview.resize(); }).observe($('wmap'));
    new ResizeObserver(() => app.view.resize()).observe($('world'));
    CH.Home.buildHud();
    app.view.handler = CH.Home.handler;
    app.view.frame(S.area(app.save), app.view.w < 760 ? 0.4 : 1);
    CH.Home.refreshHud(true);
    window.addEventListener('pointerdown', () => CH.Audio.ensure(), { capture: true });
    window.addEventListener('keydown', e => {
      if (e.key === 'Escape') { if (UI.modalOpen()) UI.closeModal(); else if (UI.sheetOpen()) UI.back(); else if (app.mode === 'battle') CH.BattleUI.handler.cancel(); else if (app.mode === 'world') CH.WorldUI.close(); else CH.Home.handler.cancel(); }
    });
    document.addEventListener('visibilitychange', () => { if (document.hidden) app.persist(); });
    window.addEventListener('beforeunload', () => app.persist());
    titleScreen();
    requestAnimationFrame(frame);
  };
  return app;
})();
CH.App.boot();

</script>
</body>
</html>
